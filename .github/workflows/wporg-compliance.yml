name: WP.org Compliance Check

on:
  workflow_call:
    inputs:
      plugin-dir:
        description: 'Path to plugin directory (relative to repo root)'
        required: false
        type: string
        default: '.'
      php-version:
        description: 'PHP version for PHPCS'
        required: false
        type: string
        default: '8.0'
      fail-on-warnings:
        description: 'Fail the check on warnings (not just blockers)'
        required: false
        type: boolean
        default: false
      phpcs-standard:
        description: 'PHPCS standard to use'
        required: false
        type: string
        default: 'WordPress-Extra'
      plugin-text-domain:
        description: 'Plugin text domain for PHPCS prefix check'
        required: false
        type: string
        default: ''
      ai-review:
        description: 'Run the AI review of changed code (needs GEMINI_API_KEY or ANTHROPIC_API_KEY)'
        required: false
        type: boolean
        default: true
      full-audit:
        description: 'AI-review every shipped file instead of only the change (scheduled runs always do this)'
        required: false
        type: boolean
        default: false
      fail-on-ai-blockers:
        description: 'Fail the Compliance Gate when the AI review reports blockers'
        required: false
        type: boolean
        default: true
      ai-provider:
        description: 'AI provider: auto (first key found: Claude, OpenAI, Gemini), gemini, openai or claude. Providers with a key are fallbacks.'
        required: false
        type: string
        default: 'auto'
      gemini-model:
        description: 'Gemini model for the AI review (default: gemini-flash-lite-latest, which has free-tier quota; set a stronger model if billing is enabled)'
        required: false
        type: string
        default: ''
      openai-model:
        description: 'OpenAI model for the AI review (default: gpt-5-mini); used when OPENAI_API_KEY is set'
        required: false
        type: string
        default: ''
      claude-model:
        description: 'Claude model for the AI review (default: claude-opus-5-5); used when ANTHROPIC_API_KEY is set'
        required: false
        type: string
        default: ''
    secrets:
      GEMINI_API_KEY:
        description: 'Google Gemini API key for the AI review (optional)'
        required: false
      OPENAI_API_KEY:
        description: 'OpenAI (ChatGPT) API key for the AI review (optional)'
        required: false
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for the AI review (optional; preferred over Gemini when both are set)'
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ─── Job 1: PHPCS + WordPress Coding Standards ───
  phpcs:
    name: PHPCS / WordPress Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: cs2pr, phpcs, phpcbf

      - name: Install WordPress Coding Standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev wp-coding-standards/wpcs:"^3.0" phpcompatibility/phpcompatibility-wp:"*" dealerdirect/phpcodesniffer-composer-installer:"^1.0"
          phpcs -i

      - name: Run PHPCS
        id: phpcs
        continue-on-error: true
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.plugin-text-domain }}" ]; then
            EXTRA_ARGS="--runtime-set text_domain ${{ inputs.plugin-text-domain }}"
          fi

          # Skip what never ships to WP.org: dependencies, build output, tests, docs,
          # generated files, plus everything in the plugin's .distignore.
          IGNORE="*/vendor/*,*/node_modules/*,*/build/*,*/dist/*,*/tests/*,*/test/*,*/docs/*,*/ai-docs/*,*/.github/*,*/languages/*,*.min.js,*.asset.php"
          DISTIGNORE="${{ inputs.plugin-dir }}/.distignore"
          if [ -f "$DISTIGNORE" ]; then
            while IFS= read -r pattern || [ -n "$pattern" ]; do
              pattern="$(echo "$pattern" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -z "$pattern" ] && continue
              case "$pattern" in \#*) continue ;; esac
              pattern="${pattern#/}"
              pattern="${pattern%/}"
              pattern="${pattern//\*\*/*}"
              IGNORE="$IGNORE,*/$pattern/*,*/$pattern"
            done < "$DISTIGNORE"
          fi
          echo "PHPCS ignores: $IGNORE"

          phpcs \
            --standard=${{ inputs.phpcs-standard }} \
            --extensions=php \
            --ignore="$IGNORE"             --basepath="${{ inputs.plugin-dir }}" \
            --report=checkstyle \
            --report-file=phpcs-report.xml \
            $EXTRA_ARGS \
            ${{ inputs.plugin-dir }} || true

          # Also generate human-readable report
          phpcs \
            --standard=${{ inputs.phpcs-standard }} \
            --extensions=php \
            --ignore="$IGNORE"             --basepath="${{ inputs.plugin-dir }}" \
            --report=summary \
            $EXTRA_ARGS \
            ${{ inputs.plugin-dir }} > phpcs-summary.txt 2>&1 || true

          cat phpcs-summary.txt

      - name: Convert PHPCS to PR annotations
        if: always()
        run: |
          if [ -f phpcs-report.xml ]; then
            cs2pr phpcs-report.xml || true
          fi

      - name: Write PHPCS report to run summary
        if: always()
        run: |
          {
            echo "## PHPCS / WordPress Coding Standards"
            echo ""
            echo "Style findings are informational and do not fail the check."
            echo ""
            echo '```'
            if [ -f phpcs-summary.txt ]; then head -c 60000 phpcs-summary.txt; else echo "No PHPCS report was produced."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PHPCS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpcs-report
          path: |
            phpcs-report.xml
            phpcs-summary.txt

  # ─── Job 2: WP.org Compliance Grep Checks ───
  wporg-compliance:
    name: WP.org Compliance
    runs-on: ubuntu-latest
    outputs:
      blockers: ${{ steps.check.outputs.blockers }}
      warnings: ${{ steps.check.outputs.warnings }}
      result: ${{ steps.check.outputs.result }}
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      # The checker is embedded instead of checked out: calling repositories get a
      # GITHUB_TOKEN that cannot read this private repository. This step must not
      # contain any ${{ }} expression: a run block with an expression is limited
      # to 21,000 characters, and the embedded script is longer than that.
      - name: Write compliance checker
        run: |
          # >>> embedded check-wporg-compliance.sh (generated by action/embed-checker.py, do not edit)
          cat > "$RUNNER_TEMP/check-wporg-compliance.sh" <<'WPPOOL_CHECKER_EOF'
          #!/bin/bash
          # WP.org Compliance Checker - Grep-based checks that PHPCS doesn't catch
          # Used by GitHub Actions workflow for PR review
          #
          # Usage: ./check-wporg-compliance.sh /path/to/plugin
          # Output: JSON findings to stdout, human-readable to stderr

          set -euo pipefail

          PLUGIN_DIR="${1:-.}"
          FINDINGS_FILE=$(mktemp)
          EXIT_CODE=0

          # Colors for stderr output
          RED='\033[0;31m'
          YELLOW='\033[1;33m'
          GREEN='\033[0;32m'
          NC='\033[0m'

          # Track counts
          BLOCKERS=0
          WARNINGS=0
          INFO_COUNT=0

          # ─── Helper Functions ───

          # Escape a value for use inside a JSON string.
          json_escape() {
              printf '%s' "$1" | tr -d '\r' | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/\t/\\t/g' | tr -d '\000-\010\013\014\016-\037' | tr '\n' ' '
          }

          add_finding() {
              local severity="$1"  # BLOCKER, WARNING, INFO
              local category="$2"
              local file="$3"
              local line="$4"
              local message="$5"
              local fix="${6:-}"

              echo "{\"severity\":\"$severity\",\"category\":\"$category\",\"file\":\"$(json_escape "$file")\",\"line\":${line:-0},\"message\":\"$(json_escape "$message")\",\"fix\":\"$(json_escape "$fix")\"}" >> "$FINDINGS_FILE"

              case "$severity" in
                  BLOCKER) ((BLOCKERS++)) || true; echo -e "${RED}[BLOCKER]${NC} $category | $file:$line | $message" >&2 ;;
                  WARNING) ((WARNINGS++)) || true; echo -e "${YELLOW}[WARNING]${NC} $category | $file:$line | $message" >&2 ;;
                  INFO)    ((INFO_COUNT++)) || true; echo -e "${GREEN}[INFO]${NC} $category | $file:$line | $message" >&2 ;;
              esac
          }

          # Paths that never ship to WP.org: dependency folders, VCS/CI folders and
          # everything listed in the plugin's .distignore (tests/, docs/, build tooling...).
          DISTIGNORE_PATTERNS=()
          if [ -f "$PLUGIN_DIR/.distignore" ]; then
              while IFS= read -r pattern || [ -n "$pattern" ]; do
                  pattern="${pattern%$'\r'}"
                  pattern="${pattern#"${pattern%%[![:space:]]*}"}"
                  pattern="${pattern%"${pattern##*[![:space:]]}"}"
                  [[ -z "$pattern" || "$pattern" == \#* ]] && continue
                  DISTIGNORE_PATTERNS+=("$pattern")
              done < "$PLUGIN_DIR/.distignore"
          fi

          skip_path() {
              local rel="${1#"$PLUGIN_DIR"/}"
              rel="${rel#./}"
              case "/$rel" in
                  */vendor/*|*/node_modules/*|*/.git/*|*/.github/*) return 0 ;;
              esac
              distignored "$rel"
          }

          # True when a path (relative to the plugin root) is excluded by .distignore.
          distignored() {
              local rel="$1"
              local pattern glob
              for pattern in "${DISTIGNORE_PATTERNS[@]+"${DISTIGNORE_PATTERNS[@]}"}"; do
                  glob="${pattern#/}"
                  glob="${glob%/}"
                  glob="${glob//\*\*/*}"
                  if [[ "$pattern" == /* ]]; then
                      # Anchored to the plugin root: the path itself or anything below it.
                      [[ "$rel" == $glob || "$rel" == $glob/* ]] && return 0
                  else
                      # Unanchored: may match at any depth.
                      [[ "$rel" == $glob || "$rel" == $glob/* || "$rel" == */$glob || "$rel" == */$glob/* ]] && return 0
                  fi
              done
              return 1
          }

          # ─── CHECK 1: Trialware / Guideline 5 ───

          echo -e "\n=== Category 1: Trialware (Guideline 5) ===" >&2

          # is_pro / is_premium gates in PHP (not in comments, not in wp_localize_script)
          while IFS=: read -r file line content; do
              # Skip vendor/node_modules
              skip_path "$file" && continue
              # Skip comment lines
              trimmed=$(echo "$content" | sed 's/^[ \t]*//')
              [[ "$trimmed" == //* || "$trimmed" == \** || "$trimmed" == \#* ]] && continue
              # Skip wp_localize_script lines (allowed use)
              [[ "$content" == *wp_localize_script* ]] && continue
              # Skip class property definitions
              [[ "$content" == *"private "* || "$content" == *"protected "* || "$content" == *"public "* ]] && [[ "$content" == *'$is_pro'* || "$content" == *'$is_premium'* || "$content" == *'$is_ultimate'* ]] && [[ "$content" != *"if"* && "$content" != *"return"* ]] && continue

              # Flag if used in conditional (if/ternary/return)
              if echo "$content" | grep -qE '(if|return|&&|\|\||[\?:])\s*.*\b(is_pro|is_premium|is_ultimate|license_status|can_use_premium)\b'; then
                  add_finding "BLOCKER" "G5-Trialware" "$file" "$line" "License check gates functionality: ${content:0:120}" "Remove gate; use apply_filters() with real default"
              fi
          done < <(grep -rnE '\b(is_pro|is_premium|is_ultimate|license_status|can_use_premium)\b' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # apply_filters with bad defaults (null, false, [], '' used as lock)
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              if echo "$content" | grep -qE "apply_filters\s*\(\s*['\"][^'\"]+['\"]\s*,\s*(null|false|\[\]|''|\"\")\s*[,)]"; then
                  add_finding "WARNING" "G5-Trialware" "$file" "$line" "apply_filters() with potentially locking default (null/false/[]/empty): ${content:0:120}" "Use real working default value"
              fi
          done < <(grep -rnE "apply_filters\s*\(" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── CHECK 2: External Services ───

          echo -e "\n=== Category 2: External Services (G6/G7/G8) ===" >&2

          # Count external HTTP calls
          EXT_CALLS=$(grep -rn "wp_remote_get\|wp_remote_post\|wp_remote_request\|wp_remote_head\|file_get_contents\s*(\s*['\"]http" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ | wc -l || echo "0")

          # Check if readme has External services section
          HAS_EXT_SECTION=false
          if [ -f "$PLUGIN_DIR/readme.txt" ]; then
              grep -qi "external services\|third.party services\|external api" "$PLUGIN_DIR/readme.txt" && HAS_EXT_SECTION=true
          fi

          if [ "$EXT_CALLS" -gt 0 ] && [ "$HAS_EXT_SECTION" = false ]; then
              add_finding "BLOCKER" "G6-External-Services" "readme.txt" "0" "Plugin makes $EXT_CALLS external HTTP calls but readme.txt has no == External services == section" "Add == External services == with URL, purpose, data sent, ToS + privacy links"
          fi

          # Remote JS/CSS loading
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              if echo "$content" | grep -qE "(wp_enqueue_script|wp_enqueue_style|wp_register_script|wp_register_style).*https?://"; then
                  add_finding "BLOCKER" "G8-Remote-Resources" "$file" "$line" "Remote JS/CSS loading detected (must bundle locally): ${content:0:120}" "Download and bundle file locally"
              fi
          done < <(grep -rnE "(wp_enqueue_script|wp_enqueue_style|wp_register_script|wp_register_style)" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep "http" | grep -v vendor/ | grep -v node_modules/ || true)

          # Tracking without opt-in check
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "WARNING" "G7-Tracking" "$file" "$line" "Telemetry/tracking call found; verify opt-in consent: ${content:0:120}" "Ensure tracking is opt-in, off by default"
          done < <(grep -rnE "(send_tracking|track_usage|telemetry|analytics.*send|usage_data)" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── CHECK 3: Security - Input/Output ───

          echo -e "\n=== Category 3: Security I/O ===" >&2

          # Raw $_POST/$_GET/$_REQUEST without sanitization
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              trimmed=$(echo "$content" | sed 's/^[ \t]*//')
              [[ "$trimmed" == //* || "$trimmed" == \** ]] && continue
              # Skip if already wrapped in sanitize/wp_unslash
              echo "$content" | grep -qE "(sanitize_|wp_unslash|absint|intval|esc_)" && continue
              # Existence checks (isset/empty) and strict comparisons only read the value.
              remaining=$(echo "$content" | sed -E \
                  -e 's/(isset|empty)\s*\(\s*\$_(POST|GET|REQUEST|SERVER)\[[^]]*\]\s*\)//g' \
                  -e 's/\$_(POST|GET|REQUEST|SERVER)\[[^]]*\]\s*[!=]==//g' \
                  -e 's/[!=]==\s*\$_(POST|GET|REQUEST|SERVER)\[[^]]*\]//g')
              echo "$remaining" | grep -qE '\$_(POST|GET|REQUEST|SERVER)\[' || continue
              add_finding "BLOCKER" "Security-Input" "$file" "$line" "Unsanitized superglobal access: ${content:0:100}" "Use sanitize_text_field(wp_unslash(\$_POST['key']))"
          done < <(grep -rnIE '\$_(POST|GET|REQUEST|SERVER)\[' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # Missing nonce verification on AJAX handlers
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              # Extract function name from add_action
              func_name=$(echo "$content" | grep -oP "(?:array\s*\(\s*\\\$this\s*,\s*['\"])([^'\"]+)" | head -1 || echo "")
              if [ -n "$func_name" ]; then
                  # Check if function has nonce verification
                  has_nonce=$(grep -c "check_ajax_referer\|wp_verify_nonce\|verify_nonce" "$file" 2>/dev/null || true)
                  if [ "${has_nonce:-0}" -eq 0 ]; then
                      add_finding "BLOCKER" "Security-Nonce" "$file" "$line" "AJAX handler without nonce verification: ${content:0:100}" "Add check_ajax_referer('action_name', 'nonce')"
                  fi
              fi
          done < <(grep -rnE "add_action\s*\(\s*['\"]wp_ajax_(nopriv_)?" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # REST routes without permission_callback
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              # Look at the whole call (up to the next register_rest_route or 40 lines).
              call=$(awk -v s="$line" 'NR > s + 40 { exit } NR > s && /register_rest_route[[:space:]]*\(/ { exit } NR >= s { print }' "$file" 2>/dev/null || true)
              has_perm=$(echo "$call" | grep -c "permission_callback" || true)
              # Route args passed in a variable (e.g. a route table looped over): accept when
              # the same file defines permission_callback for those args.
              if [ "${has_perm:-0}" -eq 0 ] && ! echo "$call" | grep -qE "['\"]callback['\"]"; then
                  has_perm=$(grep -c "permission_callback" "$file" 2>/dev/null || true)
              fi
              if [ "${has_perm:-0}" -eq 0 ]; then
                  add_finding "BLOCKER" "Security-REST" "$file" "$line" "REST route without permission_callback: ${content:0:100}" "Add 'permission_callback' => function() { return current_user_can('manage_options'); }"
              fi
          done < <(grep -rnIE '(^|[^A-Za-z0-9_$>:])register_rest_route[[:space:]]*\(' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # Unescaped output
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              trimmed=$(echo "$content" | sed 's/^[ \t]*//')
              [[ "$trimmed" == //* || "$trimmed" == \** ]] && continue
              # Skip if already escaped
              echo "$content" | grep -qE "(esc_html|esc_attr|esc_url|esc_js|wp_kses|sanitize_)" && continue
              add_finding "WARNING" "Security-Escaping" "$file" "$line" "Possible unescaped output: ${content:0:100}" "Use esc_html(), esc_attr(), esc_url(), or wp_kses()"
          done < <(grep -rnE '^\s*echo\s+\$' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # Direct SQL without prepare
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              # The statement may continue on the next lines.
              statement=$(awk -v s="$line" 'NR >= s && NR <= s + 6 { print; if (/;/) exit } NR > s + 6 { exit }' "$file" 2>/dev/null || true)
              echo "$statement" | grep -qE -- "->prepare\s*\(" && continue
              # Query passed in a variable that was built with prepare() just above.
              query_var=$(echo "$content" | grep -oE -- '->(query|get_results|get_row|get_var|get_col)\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]*' | grep -oE '\$[A-Za-z_][A-Za-z0-9_]*$' | head -1 || true)
              if [ -n "$query_var" ] && sed -n "$(( line > 40 ? line - 40 : 1 )),${line}p" "$file" 2>/dev/null | grep -qF "${query_var} = \$wpdb->prepare("; then
                  continue
              fi
              if [ -n "$query_var" ] && sed -n "$(( line > 40 ? line - 40 : 1 )),${line}p" "$file" 2>/dev/null | grep -qF "${query_var} = \$this->wpdb->prepare("; then
                  continue
              fi
              # Fully static SQL: the only interpolation is the table prefix.
              dynamic=$(echo "$statement" | sed -E -e 's/^.*->(query|get_results|get_row|get_var|get_col)\s*\(//' -e 's/\{?\$(this->)?wpdb->[A-Za-z_]+\}?//g')
              echo "$dynamic" | grep -qE '\$[A-Za-z_]' || continue
              add_finding "BLOCKER" "Security-SQL" "$file" "$line" "Direct DB query possibly without \$wpdb->prepare(): ${content:0:100}" "Use \$wpdb->prepare() for all queries with variables"
          done < <(grep -rnE '\$wpdb->(query|get_results|get_row|get_var|get_col)\s*\(' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ | grep '\$' || true)

          # register_setting without sanitize_callback
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              has_sanitize=$(sed -n "$((line)),$((line+5))p" "$file" 2>/dev/null | grep -c "sanitize_callback" || true)
              if [ "${has_sanitize:-0}" -eq 0 ]; then
                  add_finding "BLOCKER" "Security-Settings" "$file" "$line" "register_setting() without sanitize_callback: ${content:0:100}" "Add 'sanitize_callback' in third argument array"
              fi
          done < <(grep -rn "register_setting" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── CHECK 4: ABSPATH Guard ───

          echo -e "\n=== Category 4: ABSPATH Guard ===" >&2

          while IFS= read -r file; do
              skip_path "$file" && continue
              has_guard=$(head -20 "$file" | grep -cE "defined\s*\(\s*['\"]ABSPATH['\"]" || true)
              if [ "${has_guard:-0}" -eq 0 ]; then
                  # Code lines, ignoring the open/close tags, comments and blank lines.
                  first_code=$(awk '{ gsub(/<\?php|\?>/, "") } /^[[:space:]]*(\/\/|#|\/?\*)/ || /^[[:space:]]*$/ { next } { print; exit }' "$file" 2>/dev/null || true)
                  # Empty / "Silence is golden" files and data files (<?php return [...]) are safe.
                  [ -z "$first_code" ] && continue
                  echo "$first_code" | grep -qE '^\s*return[[:space:](\[]' && continue
                  basename_file=$(basename "$file")
                  if [ "$basename_file" = "uninstall.php" ]; then
                      has_uninstall_guard=$(head -20 "$file" | grep -cE "defined\s*\(\s*['\"]WP_UNINSTALL_PLUGIN['\"]" || true)
                      if [ "${has_uninstall_guard:-0}" -eq 0 ]; then
                          add_finding "BLOCKER" "Direct-Access" "$file" "1" "uninstall.php missing WP_UNINSTALL_PLUGIN guard" "Add: if ( ! defined( 'WP_UNINSTALL_PLUGIN' ) ) exit;"
                      fi
                  else
                      add_finding "BLOCKER" "Direct-Access" "$file" "1" "PHP file missing ABSPATH guard" "Add: if ( ! defined( 'ABSPATH' ) ) exit;"
                  fi
              fi
          done < <(find "$PLUGIN_DIR" -name "*.php" -not -path "*/vendor/*" -not -path "*/node_modules/*" 2>/dev/null || true)


          # ─── CHECK 5: Plugin Updater ───

          echo -e "\n=== Category 5: Plugin Updater ===" >&2

          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "BLOCKER" "Plugin-Updater" "$file" "$line" "Custom plugin updater detected (forbidden by G8): ${content:0:100}" "Remove custom updater; use WP.org update system only"
          done < <(grep -rnE "(plugin-update-checker|WP_GitHub_Updater|WPGitHubUpdater|PucFactory|YahnisElsts|pre_set_site_transient_update_plugins|site_transient_update_plugins|add_filter\s*\(\s*['\"]plugins_api['\"])" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── CHECK 6: Forbidden Files ───

          echo -e "\n=== Category 6: Forbidden Files ===" >&2

          # Compressed files
          while IFS= read -r file; do
              skip_path "$file" && continue
              add_finding "BLOCKER" "Forbidden-File" "$file" "0" "Compressed/archive file in plugin (remove before submission)" "Delete file; use composer/npm for dependencies"
          done < <(find "$PLUGIN_DIR" -type f \( -name "*.zip" -o -name "*.gz" -o -name "*.tgz" -o -name "*.rar" -o -name "*.tar" -o -name "*.7z" -o -name "*.phar" \) -not -path "*/node_modules/*" 2>/dev/null || true)

          # Executable files
          while IFS= read -r file; do
              skip_path "$file" && continue
              add_finding "BLOCKER" "Forbidden-File" "$file" "0" "Executable/binary file in plugin" "Remove file"
          done < <(find "$PLUGIN_DIR" -type f \( -name "*.exe" -o -name "*.sh" -o -name "*.bin" -o -name "*.so" -o -name "*.dll" \) -not -path "*/node_modules/*" -not -path "*/.github/*" 2>/dev/null || true)

          # AI/VCS directories
          while IFS= read -r dir; do
              skip_path "$dir/" && continue
              add_finding "WARNING" "Forbidden-Dir" "$dir" "0" "AI/IDE config directory should not ship to WP.org" "Add to .distignore"
          done < <(find "$PLUGIN_DIR" -maxdepth 2 -type d \( -name ".cursor" -o -name ".claude" -o -name ".aider" -o -name ".continue" -o -name ".windsurf" -o -name ".ai" -o -name ".vscode" -o -name ".idea" \) 2>/dev/null || true)

          # Files with spaces in name
          while IFS= read -r file; do
              skip_path "$file" && continue
              basename_file=$(basename "$file")
              if echo "$basename_file" | grep -q " "; then
                  add_finding "BLOCKER" "Forbidden-File" "$file" "0" "Filename contains spaces: $basename_file" "Rename file; remove spaces"
              fi
          done < <(find "$PLUGIN_DIR" -type f -name "* *" -not -path "*/node_modules/*" -not -path "*/vendor/*" 2>/dev/null || true)


          # ─── CHECK 7: Readme Validation ───

          echo -e "\n=== Category 7: Readme ===" >&2

          if [ -f "$PLUGIN_DIR/readme.txt" ]; then
              # Stable tag = trunk
              if grep -qi "Stable tag:\s*trunk" "$PLUGIN_DIR/readme.txt"; then
                  add_finding "BLOCKER" "Readme" "readme.txt" "0" "Stable tag set to 'trunk' (must be specific version)" "Set Stable tag to match plugin Version header"
              fi

              # More than 5 tags
              TAG_COUNT=$(grep -i "^Tags:" "$PLUGIN_DIR/readme.txt" | head -1 | tr ',' '\n' | wc -l || echo "0")
              if [ "$TAG_COUNT" -gt 5 ]; then
                  add_finding "WARNING" "Readme" "readme.txt" "0" "Too many tags ($TAG_COUNT); maximum 5 allowed" "Reduce to 5 most relevant tags"
              fi

              # Missing tested up to
              if ! grep -qi "Tested up to:" "$PLUGIN_DIR/readme.txt"; then
                  add_finding "WARNING" "Readme" "readme.txt" "0" "Missing 'Tested up to' field" "Add: Tested up to: 6.7"
              fi

              # Update URI in plugin header (forbidden)
              MAIN_FILE=$(grep -rl "Plugin Name:" "$PLUGIN_DIR" --include="*.php" | head -1 || echo "")
              if [ -n "$MAIN_FILE" ] && grep -qi "Update URI:" "$MAIN_FILE"; then
                  add_finding "BLOCKER" "Plugin-Header" "$MAIN_FILE" "0" "Update URI header detected (instant rejection)" "Remove Update URI from plugin header"
              fi
          else
              add_finding "BLOCKER" "Readme" "readme.txt" "0" "No readme.txt found" "Create readme.txt per WP.org format"
          fi


          # ─── CHECK 8: ALLOW_UNFILTERED_UPLOADS ───

          echo -e "\n=== Category 8: Dangerous Constants ===" >&2

          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "BLOCKER" "Dangerous-Constant" "$file" "$line" "ALLOW_UNFILTERED_UPLOADS defined (instant rejection)" "Remove; never define this constant"
          done < <(grep -rn "ALLOW_UNFILTERED_UPLOADS" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # Defining WP core constants
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "WARNING" "Dangerous-Constant" "$file" "$line" "Plugin defines WP core constant: ${content:0:100}" "Remove; do not redefine WP core constants"
          done < <(grep -rnIE "define\s*\(\s*['\"]WP_(DEBUG|DEBUG_LOG|DEBUG_DISPLAY|MEMORY_LIMIT|MAX_MEMORY_LIMIT|CONTENT_DIR|CONTENT_URL|PLUGIN_DIR|PLUGIN_URL|LANG_DIR|HOME|SITEURL|CACHE|POST_REVISIONS|AUTO_UPDATE_CORE|ALLOW_REPAIR|ALLOW_MULTISITE|DEFAULT_THEME|TEMP_DIR|ENVIRONMENT_TYPE|CRON_LOCK_TIMEOUT|DISABLE_FATAL_ERROR_HANDLER|HTTP_BLOCK_EXTERNAL|ACCESSIBLE_HOSTS)['\"]" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── CHECK 9: Localhost References ───

          echo -e "\n=== Category 9: Localhost ===" >&2

          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "WARNING" "Localhost" "$file" "$line" "Localhost/dev reference found: ${content:0:80}" "Remove before production release"
          done < <(grep -rnIE "(localhost|127\.0\.0\.1)" "$PLUGIN_DIR" --include="*.php" --include="*.js" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ | grep -v "*.min.js" || true)


          # ─── CHECK 10: Code Obfuscation ───

          echo -e "\n=== Category 10: Code Obfuscation ===" >&2

          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "BLOCKER" "Obfuscation" "$file" "$line" "Obfuscated/encoded code detected: ${content:0:80}" "Ship readable source code"
          done < <(grep -rnE '(@Zend;|sourceguardian\.com|sg_load|ionCube|\$__x=|eval\s*\(\s*base64_decode|eval\s*\(\s*gzinflate)' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── CHECK 11: Appsero SDK (WPPOOL-specific) ───

          echo -e "\n=== Category 11: Appsero SDK ===" >&2

          APPSERO_FILE=$(find "$PLUGIN_DIR" -path "*/appsero/src/Client.php" -not -path "*/node_modules/*" 2>/dev/null | head -1 || echo "")
          if [ -n "$APPSERO_FILE" ]; then
              # Check for updater method usage
              while IFS=: read -r file line content; do
                  skip_path "$file" && continue
                  add_finding "BLOCKER" "Appsero-Updater" "$file" "$line" "Appsero updater() call in free plugin (forbidden by G8)" "Remove ->updater() call; free plugins use WP.org updates"
              done < <(grep -rn "->updater()" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

              # Check if Appsero is disclosed in readme
              if [ -f "$PLUGIN_DIR/readme.txt" ]; then
                  has_appsero_disclosure=$(grep -ci "appsero" "$PLUGIN_DIR/readme.txt" || true)
                  if [ "${has_appsero_disclosure:-0}" -eq 0 ]; then
                      add_finding "BLOCKER" "Appsero-Disclosure" "readme.txt" "0" "Appsero SDK bundled but not disclosed in readme External services section" "Add Appsero to == External services == with api.appsero.com URL"
                  fi
              fi
          fi


          # ─── CHECK 12: Headway Changelog Widget ───

          echo -e "\n=== Category 12: Headway Widget ===" >&2

          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "WARNING" "Headway-Widget" "$file" "$line" "Headway changelog widget loads external CDN; needs disclosure" "Add to readme == External services == OR make opt-in"
          done < <(grep -rnE "(headway|headwayapp\.co|HW_widget)" "$PLUGIN_DIR" --include="*.php" --include="*.js" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── Shared data for the repo-level checks below ───

          # Every file WP.org would receive: all files except dependency/VCS folders and .distignore
          # entries. Unlike skip_path(), vendor/ is included because bundled libraries ship too.
          SHIPPED=()
          while IFS= read -r f; do
              rel="${f#"$PLUGIN_DIR"/}"
              rel="${rel#./}"
              distignored "$rel" && continue
              SHIPPED+=("$rel")
          done < <(find "$PLUGIN_DIR" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/.github/*" 2>/dev/null | sort || true)

          # True when a shipped file matches the glob (relative to the plugin root).
          ships() {
              local want="$1" rel
              for rel in "${SHIPPED[@]+"${SHIPPED[@]}"}"; do
                  # shellcheck disable=SC2053
                  [[ "$rel" == $want ]] && return 0
              done
              return 1
          }

          README_TXT=""
          [ -f "$PLUGIN_DIR/readme.txt" ] && README_TXT=$(tr -d '\r' < "$PLUGIN_DIR/readme.txt")
          readme_has() { grep -qiE -- "$1" <<< "$README_TXT"; }

          MAIN_PHP=$(grep -lE '^[[:space:]/*#]*Plugin Name:' "$PLUGIN_DIR"/*.php 2>/dev/null | awk 'NR == 1' || true)
          TEXT_DOMAIN="${TEXT_DOMAIN:-}"
          if [ -z "$TEXT_DOMAIN" ] && [ -n "$MAIN_PHP" ]; then
              TEXT_DOMAIN=$(awk 'tolower($0) ~ /text domain:/ { sub(/.*[Tt]ext [Dd]omain:/, ""); gsub(/[[:space:]\r]/, ""); print; exit }' "$MAIN_PHP" || true)
          fi

          is_comment() {
              local trimmed="${1#"${1%%[![:space:]]*}"}"
              [[ "$trimmed" == //* || "$trimmed" == \** || "$trimmed" == /\** || "$trimmed" == \#* ]]
          }

          PY=""
          for cand in python3 python; do
              if command -v "$cand" >/dev/null 2>&1 && "$cand" -c 'import json' >/dev/null 2>&1; then
                  PY="$cand"
                  break
              fi
          done


          # ─── CHECK 13: Source code for compiled assets (Guideline 4) ───

          echo -e "\n=== Category 13: Source Code & Build (G4) ===" >&2

          BUILT_JS=()
          SOURCE_FILES=0
          for rel in "${SHIPPED[@]+"${SHIPPED[@]}"}"; do
              case "/$rel" in
                  */vendor/*) continue ;;
                  *.min.js|*/build/*.js|*/dist/*.js) BUILT_JS+=("$rel"); continue ;;
                  *.config.js|*/webpack.*.js|*/gulpfile.js|*/Gruntfile.js) continue ;;
                  *.js) grep -qE '__webpack_require__|webpackChunk|webpackJsonp' "$PLUGIN_DIR/$rel" 2>/dev/null && { BUILT_JS+=("$rel"); continue; }
                        SOURCE_FILES=$((SOURCE_FILES + 1)) ;;
                  *.jsx|*.ts|*.tsx|*.vue|*.scss|*.sass|*.less) SOURCE_FILES=$((SOURCE_FILES + 1)) ;;
              esac
          done

          if [ "${#BUILT_JS[@]}" -gt 0 ]; then
              if readme_has '(github\.com|gitlab\.com|bitbucket\.org)/'; then
                  : # Public source repository linked from readme.txt.
              elif ! ships "package.json" || [ "$SOURCE_FILES" -eq 0 ]; then
                  add_finding "BLOCKER" "G4-Source" "${BUILT_JS[0]}" "0" "Compiled/minified JS ships (${#BUILT_JS[@]} file(s)) without its human-readable source (package.json and the source files are not shipped, and readme.txt links no public repository)" "Ship the source (src/, package.json, build config; remove them from .distignore) or link the public source repository in readme.txt == Build Instructions =="
              fi
              if ! readme_has '^==[[:space:]]*(build instructions|source code|development|developers)'; then
                  add_finding "WARNING" "G4-Source" "readme.txt" "0" "Compiled JS ships (e.g. ${BUILT_JS[0]}) but readme.txt has no == Build Instructions == section" "Add == Build Instructions == with the commands to rebuild the assets (e.g. npm install && npm run build) and where the source lives"
              fi
          fi


          # ─── CHECK 14: Bundled libraries ───

          echo -e "\n=== Category 14: Bundled Libraries ===" >&2

          # Composer-installed code must ship with composer.json.
          if ships "vendor/*" && ! ships "composer.json"; then
              add_finding "BLOCKER" "Library-Composer" "vendor/" "0" "vendor/ ships without composer.json, so reviewers cannot see how the bundled libraries are installed or updated" "Install bundled SDKs with Composer and ship composer.json (composer.lock may stay in .distignore)"
          fi

          APPSERO_CLIENT=""
          LC_SAVED="${LC_ALL:-}"
          for rel in "${SHIPPED[@]+"${SHIPPED[@]}"}"; do
              base="${rel##*/}"
              lower="${base,,}"
              case "/$rel" in
                  */appsero/*Client.php)
                      [ -z "$APPSERO_CLIENT" ] && APPSERO_CLIENT="$rel"
                      case "/$rel" in
                          */vendor/*) ;;
                          *) add_finding "WARNING" "Library-Composer" "$rel" "0" "Appsero SDK copied into the plugin by hand instead of installed with Composer" "Require appsero/client with Composer and remove the manual copy" ;;
                      esac ;;
              esac
              # Libraries WordPress core already ships.
              case "$lower" in
                  jquery.js|jquery.min.js|jquery-[0-9]*.js|jquery-ui.js|jquery-ui.min.js|jquery-ui-[0-9]*.js|jquery-migrate*.js|backbone.js|backbone-min.js|backbone.min.js|underscore.js|underscore-min.js|underscore.min.js|moment.js|moment.min.js|react.development.js|react.production.min.js|react-dom.*.js|lodash.js|lodash.min.js|class-phpmailer.php|phpmailer.php|class-simplepie.php|simplepie.php)
                      add_finding "BLOCKER" "Library-Core" "$rel" "0" "Bundles a library WordPress core already ships ($base)" "Remove it and depend on the core script handle (jquery, jquery-ui-*, backbone, underscore, moment, react / wp-element, lodash) or core class instead" ;;
              esac
          done

          # Appsero SDK version (an outdated Appsero client was flagged in all 9 WPPOOL closures).
          # Committed SDK: read Client.php. Composer-installed at release: read composer.lock.
          APPSERO_VERSION=""
          APPSERO_WHERE=""
          if [ -n "$APPSERO_CLIENT" ]; then
              APPSERO_VERSION=$(awk -F"'" '/\$version[[:space:]]*=/ { print $2; exit }' "$PLUGIN_DIR/$APPSERO_CLIENT" 2>/dev/null || true)
              APPSERO_WHERE="$APPSERO_CLIENT"
          elif [ -f "$PLUGIN_DIR/composer.lock" ]; then
              APPSERO_VERSION=$(awk '/"name"[[:space:]]*:[[:space:]]*"appsero\/client"/ { found = 1 } found && /"version"/ { gsub(/[^0-9.]/, ""); print; exit }' "$PLUGIN_DIR/composer.lock" 2>/dev/null || true)
              APPSERO_WHERE="composer.lock"
          fi
          if [ -n "$APPSERO_VERSION" ]; then
              APPSERO_LATEST=$(curl -fsS --max-time 15 "https://repo.packagist.org/p2/appsero/client.json" 2>/dev/null \
                  | grep -oE '"version":"v?[0-9]+\.[0-9]+\.[0-9]+"' | sed -E 's/.*"v?([0-9.]+)"/\1/' | sort -V | awk 'END { print }' || true)
              APPSERO_LATEST="${APPSERO_LATEST:-2.0.4}"
              if [ -n "$APPSERO_VERSION" ] && [ "$APPSERO_VERSION" != "$APPSERO_LATEST" ] \
                  && [ "$(printf '%s\n%s\n' "$APPSERO_VERSION" "$APPSERO_LATEST" | sort -V | awk 'NR == 1')" = "$APPSERO_VERSION" ]; then
                  add_finding "BLOCKER" "Library-Outdated" "$APPSERO_WHERE" "0" "Appsero SDK $APPSERO_VERSION is outdated (latest is $APPSERO_LATEST); an outdated Appsero client was cited in every WPPOOL closure" "composer update appsero/client, then re-test the opt-in screen"
              fi
          fi

          # Other Composer packages: outdated or abandoned according to Packagist.
          if [ -n "$PY" ] && [ -f "$PLUGIN_DIR/composer.lock" ]; then
              while IFS='|' read -r pkg installed latest abandoned; do
                  [ -z "$pkg" ] && continue
                  if [ -n "$abandoned" ]; then
                      add_finding "WARNING" "Library-Abandoned" "vendor/$pkg" "0" "$pkg is marked abandoned on Packagist (replacement: $abandoned)" "Switch to the maintained replacement or remove the dependency"
                  fi
                  if [ -n "$latest" ] && [ "$installed" != "$latest" ]; then
                      add_finding "WARNING" "Library-Outdated" "vendor/$pkg" "0" "$pkg $installed is bundled; the latest stable release is $latest" "Run composer update $pkg and re-test"
                  fi
              done < <("$PY" - "$PLUGIN_DIR/composer.lock" 2>/dev/null <<'WPPOOL_PACKAGIST_PY' || true
          import json
          import re
          import sys
          import urllib.request


          def stable(version):
              return re.fullmatch(r'v?\d+(\.\d+)*', version or '') is not None


          def key(version):
              return [int(part) for part in version.lstrip('v').split('.')]


          lock = json.load(open(sys.argv[1], encoding='utf-8'))
          for pkg in lock.get('packages', []):
              name = pkg.get('name', '')
              installed = str(pkg.get('version', '')).lstrip('v')
              if not name or name == 'appsero/client' or not stable(installed):
                  continue
              try:
                  with urllib.request.urlopen('https://repo.packagist.org/p2/' + name + '.json', timeout=15) as resp:
                      versions = json.load(resp).get('packages', {}).get(name, [])
              except Exception:
                  continue
              stables = [v['version'] for v in versions if stable(v.get('version', ''))]
              latest = max(stables, key=key).lstrip('v') if stables else ''
              abandoned = versions[0].get('abandoned') if versions else None
              if abandoned is True:
                  abandoned = 'none suggested'
              print('|'.join([name, installed, latest, abandoned or '']))
          WPPOOL_PACKAGIST_PY
          )
          fi


          # ─── CHECK 15: WP.org code rules ───

          echo -e "\n=== Category 15: WP.org Code Rules ===" >&2

          # Loading WordPress core files directly.
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              is_comment "$content" && continue
              add_finding "BLOCKER" "Core-Loading" "$file" "$line" "Loads a WordPress core loading file directly: ${content:0:120}" "Run inside WordPress instead (admin-ajax.php, the REST API or admin-post.php hooks)"
          done < <(grep -rnIE "(require|include)(_once)?[^;]*(wp-(load|config|blog-header|settings)\.php|wp-admin/admin\.php)" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # HEREDOC / NOWDOC.
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              is_comment "$content" && continue
              add_finding "BLOCKER" "HEREDOC" "$file" "$line" "HEREDOC/NOWDOC syntax (WP.org asks for it to be removed): ${content:0:100}" "Use normal strings, or close PHP and write the HTML with escaped echo statements"
          done < <(grep -rnIE "<<<[[:space:]]*['\"]?[A-Za-z_]" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # ob_start() without a matching close.
          while IFS= read -r file; do
              skip_path "$file" && continue
              opens=$(grep -cE '(^|[^A-Za-z0-9_])ob_start[[:space:]]*\(' "$file" || true)
              closes=$(grep -cE '(^|[^A-Za-z0-9_])ob_(get_clean|end_clean|end_flush|get_flush)[[:space:]]*\(' "$file" || true)
              if [ "${opens:-0}" -gt "${closes:-0}" ]; then
                  first=$(grep -nE '(^|[^A-Za-z0-9_])ob_start[[:space:]]*\(' "$file" | awk -F: 'NR == 1 { print $1 }' || true)
                  add_finding "WARNING" "Output-Buffer" "$file" "${first:-0}" "ob_start() is called ${opens} time(s) but buffers are closed only ${closes} time(s) in this file" "Close every buffer with ob_get_clean() / ob_end_clean() on every path, including early returns"
              fi
          done < <(grep -rlE '(^|[^A-Za-z0-9_])ob_start[[:space:]]*\(' "$PLUGIN_DIR" --include="*.php" 2>/dev/null || true)

          # Changing global PHP settings.
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              is_comment "$content" && continue
              severity="WARNING"
              [[ "$content" == *date_default_timezone_set* ]] && severity="BLOCKER"
              add_finding "$severity" "Server-Config" "$file" "$line" "Changes a global PHP setting for the whole site: ${content:0:100}" "Remove it; use wp_date()/current_time() for time zones and let the site owner manage PHP limits"
          done < <(grep -rnIE '(^|[^A-Za-z0-9_>:$])(ini_set|error_reporting|date_default_timezone_set|set_time_limit)[[:space:]]*\(' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # Hardcoded wp-content / wp-json paths.
          while IFS=: read -r file line content; do
              case "$file" in *.min.js|*/build/*|*/dist/*) continue ;; esac
              skip_path "$file" && continue
              is_comment "$content" && continue
              add_finding "WARNING" "Hardcoded-Path" "$file" "$line" "Hardcoded WordPress path/URL: ${content:0:100}" "Use plugin_dir_path(), plugins_url(), content_url(), wp_upload_dir() or rest_url() (wp.apiFetch / wpApiSettings.root in JS)"
          done < <(grep -rnIE "['\"/]wp-content/(plugins|themes|uploads)|['\"]/?wp-json/" "$PLUGIN_DIR" --include="*.php" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" --include="*.vue" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # Writing into the plugin/theme/core folders or generating PHP files.
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              is_comment "$content" && continue
              if echo "$content" | grep -qE "index\.php['\"]"; then
                  continue  # "Silence is golden" index.php guards in upload folders are fine.
              elif echo "$content" | grep -qE "\.php['\"]"; then
                  add_finding "BLOCKER" "File-Write" "$file" "$line" "Writes a PHP file: ${content:0:100}" "Never generate PHP files; store data in the database or under wp_upload_dir()"
              elif echo "$content" | grep -qE '__DIR__|__FILE__|plugin_dir_path|WP_PLUGIN_DIR|WP_CONTENT_DIR|ABSPATH|get_template_directory|get_stylesheet_directory|_PLUGIN_(DIR|PATH)|_DIR[^A-Za-z]|_PATH[^A-Za-z]'; then
                  add_finding "WARNING" "File-Write" "$file" "$line" "Possibly writes into the plugin/theme/core folder: ${content:0:100}" "Write files under wp_upload_dir() (or keep the data in the database); plugin folders are replaced on update"
              fi
          done < <(grep -rnIE '(^|[^A-Za-z0-9_>:$])(file_put_contents|fopen|copy|rename|move_uploaded_file|mkdir|wp_mkdir_p)[[:space:]]*\(' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ | grep -vE "fopen[[:space:]]*\([[:space:]]*['\"]php://" || true)

          # Installing or activating other plugins.
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              is_comment "$content" && continue
              add_finding "WARNING" "Plugin-Install" "$file" "$line" "Installs or activates another plugin: ${content:0:100}" "Only allowed as a direct user action (button click) with nonce + capability checks; prefer the Requires Plugins header or a link to the core plugin installer"
          done < <(grep -rnIE '(^|[^A-Za-z0-9_>:$])(activate_plugins?)[[:space:]]*\(|new[[:space:]]+(\\)?Plugin_Upgrader|(^|[^A-Za-z0-9_>:$])plugins_api[[:space:]]*\(' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # Free code that detects Pro (class_exists / defined / function_exists / is_plugin_active).
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              is_comment "$content" && continue
              add_finding "WARNING" "G5-Pro-Gate" "$file" "$line" "Free code checks whether Pro is installed: ${content:0:120}. If this changes what the free plugin does, it is trialware (G5)" "Keep free behaviour identical with or without Pro; expose apply_filters()/do_action() hooks that Pro attaches to"
          done < <(grep -rnIE "(class_exists|defined|function_exists|is_plugin_active)[[:space:]]*\([[:space:]]*['\"][^'\"]*(PRO(_|['\"])|Pro([A-Z_\\\\]|['\"])|[-_]pro([-_/.]|['\"])|[Pp]remium|PREMIUM)" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # Review links filtered to 5 stars.
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "BLOCKER" "Review-Manipulation" "$file" "$line" "Review link filtered to 5-star reviews: ${content:0:100}" "Link to the plain reviews page (wordpress.org/support/plugin/<slug>/reviews/#new-post)"
          done < <(grep -rnIE 'reviews/?\?filter=5' "$PLUGIN_DIR" --include="*.php" --include="*.js" --include="*.jsx" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── CHECK 16: Internationalization and file names ───

          echo -e "\n=== Category 16: i18n & File Names ===" >&2

          STR_RE="('([^'\\\\]|\\\\.)*'|\"([^\"\\\\]|\\\\.)*\")"
          I18N_SIMPLE="(^|[^A-Za-z0-9_>:$])(__|_e|esc_html__|esc_html_e|esc_attr__|esc_attr_e)[[:space:]]*\\([[:space:]]*${STR_RE}[[:space:]]*(,[[:space:]]*[^),]+)?\\)"
          I18N_CONTEXT="(^|[^A-Za-z0-9_>:$])(_x|_ex|esc_html_x|esc_attr_x)[[:space:]]*\\([[:space:]]*${STR_RE}[[:space:]]*,[[:space:]]*${STR_RE}[[:space:]]*(,[[:space:]]*[^),]+)?\\)"
          I18N_NONLITERAL="(^|[^A-Za-z0-9_>:$])(__|_e|_x|_ex|_n|esc_html__|esc_html_e|esc_attr__|esc_attr_e|esc_html_x|esc_attr_x)[[:space:]]*\\([[:space:]]*\\$"

          if [ -n "$TEXT_DOMAIN" ]; then
              while IFS=: read -r file line content; do
                  case "$file" in *.min.js|*/build/*|*/dist/*) continue ;; esac
                  skip_path "$file" && continue
                  is_comment "$content" && continue
                  if [[ "$file" == *.php ]] && grep -qE "$I18N_NONLITERAL" <<< "$content"; then
                      add_finding "BLOCKER" "i18n" "$file" "$line" "Translation function called with a variable instead of a literal string: ${content:0:100}" "Pass the literal text to __()/_e()/esc_html__() so it can be extracted for translation"
                  fi
                  while IFS= read -r call; do
                      [ -z "$call" ] && continue
                      # The domain is the argument after the string (two strings for the _x family).
                      stripped=$(sed -E "s/${STR_RE}/S/g" <<< "$call")
                      commas=$(tr -cd ',' <<< "$stripped" | wc -c)
                      needed=1
                      [[ "$call" == _x* || "$call" == _ex* || "$call" == esc_html_x* || "$call" == esc_attr_x* ]] && needed=2
                      if [ "$((commas))" -lt "$needed" ]; then
                          [[ "$file" == *.php ]] && add_finding "BLOCKER" "i18n" "$file" "$line" "Translation call without a text domain: ${call:0:100}" "Add '$TEXT_DOMAIN' as the text domain argument"
                          continue
                      fi
                      domain=$(sed -E 's/.*,[[:space:]]*([^),]+)[[:space:]]*\)$/\1/; s/[[:space:]]+$//' <<< "$call")
                      case "$domain" in
                          "'$TEXT_DOMAIN'"|"\"$TEXT_DOMAIN\"") ;;
                          \'*\'|\"*\")
                              add_finding "BLOCKER" "i18n" "$file" "$line" "Wrong text domain $domain (plugin slug is '$TEXT_DOMAIN'): ${call:0:100}" "Use '$TEXT_DOMAIN' as the text domain" ;;
                          *)
                              add_finding "BLOCKER" "i18n" "$file" "$line" "Text domain is a variable or constant ($domain), so translation tools cannot read it" "Use the literal string '$TEXT_DOMAIN'" ;;
                      esac
                  done < <(grep -oE "$I18N_SIMPLE|$I18N_CONTEXT" <<< "$content" | sed -E 's/^[^A-Za-z_]//' || true)
              done < <(grep -rnIE '(^|[^A-Za-z0-9_>:$])(__|_e|_x|_ex|_n|esc_html__|esc_html_e|esc_attr__|esc_attr_e|esc_html_x|esc_attr_x)[[:space:]]*\(' "$PLUGIN_DIR" --include="*.php" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)
          fi

          # File names that break SVN or case-insensitive / Windows file systems.
          LC_ALL=C
          UNSAFE_NAME_RE='[^-A-Za-z0-9._/+~]'
          for rel in "${SHIPPED[@]+"${SHIPPED[@]}"}"; do
              case "$rel" in *" "*) continue ;; esac  # Spaces are reported in Category 6.
              if [[ "$rel" =~ $UNSAFE_NAME_RE ]]; then
                  add_finding "BLOCKER" "File-Name" "$rel" "0" "File name contains characters that break SVN or some file systems (only letters, digits, . _ - + ~ are safe)" "Rename the file"
              fi
          done
          while IFS= read -r dup; do
              [ -z "$dup" ] && continue
              add_finding "BLOCKER" "File-Name" "$dup" "0" "Two shipped files differ only by letter case ($dup); one overwrites the other on Windows/macOS" "Rename or remove one of them"
          done < <(printf '%s\n' "${SHIPPED[@]+"${SHIPPED[@]}"}" | tr 'A-Z' 'a-z' | sort | uniq -d || true)
          LC_ALL="$LC_SAVED"
          [ -z "$LC_ALL" ] && unset LC_ALL


          # ─── CHECK 17: Every external host is documented ───

          echo -e "\n=== Category 17: External Services Disclosure (G6/G7) ===" >&2

          CALL_RE='wp_remote_|wp_safe_remote_|download_url|fetch[[:space:]]*\(|axios|XMLHttpRequest|\$\.(get|post|ajax|getJSON)|<script|<iframe|wp_enqueue_|wp_register_|sendBeacon|WebSocket|file_get_contents|curl_init|curl_setopt|api_url|API_URL|_endpoint|_ENDPOINT|apiUrl|endpoint:'
          IGNORE_HOSTS_RE='(^|\.)(wordpress\.org|w\.org|w3\.org|schema\.org|example\.(com|org|net)|localhost|php\.net|mozilla\.org|github\.com|githubusercontent\.com|reactjs\.org|react\.dev|jquery\.com|opensource\.org|gnu\.org|json-schema\.org)$'
          KNOWN_SERVICES_RE='icanhazip\.com|ipify\.org|ipinfo\.io|ip-api\.com|headwayapp\.co|appsero\.com|google-analytics\.com|googletagmanager\.com|hotjar\.com|mixpanel\.com|segment\.(io|com)|sentry\.io|intercom\.io|crisp\.chat|tawk\.to|clarity\.ms'
          declare -A HOST_SEEN=()

          report_host() {
              local host="$1" file="$2" line="$3" base
              [ -n "${HOST_SEEN[$host]:-}" ] && return 0
              HOST_SEEN[$host]=1
              grep -qE "$IGNORE_HOSTS_RE" <<< "$host" && return 0
              base=$(awk -F. '{ print (NF > 1 ? $(NF-1) "." $NF : $0) }' <<< "$host")
              readme_has "${base//./\\.}" && return 0
              add_finding "BLOCKER" "G6-External-Services" "$file" "$line" "Code contacts $host but readme.txt does not document it" "Add $host to readme.txt == External services ==: what it is used for, what data is sent and when, with links to its terms of service and privacy policy"
          }

          while IFS=: read -r file line content; do
              rel="${file#"$PLUGIN_DIR"/}"
              rel="${rel#./}"
              distignored "$rel" && continue
              # Well-known trackers and IP lookups: anywhere, including vendor/ and minified files.
              while IFS= read -r host; do
                  [ -n "$host" ] && report_host "$host" "$rel" "$line"
              done < <(grep -oiE "https?://[A-Za-z0-9.-]*($KNOWN_SERVICES_RE)" <<< "$content" | sed -E 's#^https?://##' | tr 'A-Z' 'a-z' || true)
              # Other hosts: only on lines that make a remote call, and not in minified code.
              [ "${#content}" -gt 1000 ] && continue
              case "$rel" in *.min.js) continue ;; esac
              grep -qE "$CALL_RE" <<< "$content" || continue
              while IFS= read -r host; do
                  [ -n "$host" ] && report_host "$host" "$rel" "$line"
              done < <(grep -oE 'https?://[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+' <<< "$content" | sed -E 's#^https?://##' | tr 'A-Z' 'a-z' || true)
          done < <(grep -rnIE 'https?://[A-Za-z0-9-]+\.[A-Za-z]' "$PLUGIN_DIR" --include="*.php" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" --include="*.vue" 2>/dev/null | grep -v node_modules/ || true)


          # ─── REPORT SUMMARY ───

          echo -e "\n========================================" >&2
          echo -e "=== COMPLIANCE CHECK COMPLETE ===" >&2
          echo -e "========================================" >&2
          echo -e "${RED}BLOCKERS: $BLOCKERS${NC}" >&2
          echo -e "${YELLOW}WARNINGS: $WARNINGS${NC}" >&2
          echo -e "${GREEN}INFO: $INFO_COUNT${NC}" >&2
          echo -e "========================================" >&2

          if [ "$BLOCKERS" -gt 0 ]; then
              echo -e "\n${RED}RESULT: FAIL — $BLOCKERS blocker(s) found. PR should not be merged.${NC}" >&2
              EXIT_CODE=1
          elif [ "$WARNINGS" -gt 0 ]; then
              echo -e "\n${YELLOW}RESULT: WARN — No blockers, but $WARNINGS warning(s) found. Review recommended.${NC}" >&2
              EXIT_CODE=0
          else
              echo -e "\n${GREEN}RESULT: PASS — No issues found.${NC}" >&2
              EXIT_CODE=0
          fi

          # Output JSON array to stdout
          echo "["
          first=true
          while IFS= read -r line; do
              if [ "$first" = true ]; then
                  first=false
              else
                  echo ","
              fi
              echo "  $line"
          done < "$FINDINGS_FILE"
          echo "]"

          rm -f "$FINDINGS_FILE"
          exit $EXIT_CODE
          WPPOOL_CHECKER_EOF
          # <<< embedded check-wporg-compliance.sh

      - name: Run WP.org compliance checks
        id: check
        env:
          TEXT_DOMAIN: ${{ inputs.plugin-text-domain }}
        run: |
          CHECKER="$RUNNER_TEMP/check-wporg-compliance.sh"
          chmod +x "$CHECKER"

          # Run checker, capture JSON output and exit code
          set +e
          FINDINGS=$("$CHECKER" "${{ inputs.plugin-dir }}" 2>compliance-stderr.txt)
          CHECK_EXIT=$?
          set -e

          # Show stderr (human-readable output)
          cat compliance-stderr.txt

          # Save JSON findings
          echo "$FINDINGS" > compliance-findings.json

          # Count findings
          BLOCKERS=$(echo "$FINDINGS" | grep -c '"severity":"BLOCKER"' || true)
          WARNINGS=$(echo "$FINDINGS" | grep -c '"severity":"WARNING"' || true)

          echo "blockers=$BLOCKERS" >> "$GITHUB_OUTPUT"
          echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"

          if [ "$CHECK_EXIT" -ne 0 ]; then
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          elif [ "$WARNINGS" -gt 0 ] && [ "${{ inputs.fail-on-warnings }}" = "true" ]; then
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          else
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          fi

      - name: Write compliance report to run summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          try:
              findings = json.load(open('compliance-findings.json', encoding='utf-8'))
          except Exception:
              findings = None

          print('## WP.org Compliance Report')
          print()
          if findings is None:
              print('The compliance checker did not produce a report. Open the "Run WP.org compliance checks" step log for details.')
              raise SystemExit

          def cell(value, limit):
              return str(value).replace('|', '\\|').replace('\n', ' ')[:limit]

          blockers = [f for f in findings if f.get('severity') == 'BLOCKER']
          warnings = [f for f in findings if f.get('severity') == 'WARNING']
          status = 'FAIL: fix the blockers below before merging' if blockers else 'PASS: no WP.org blockers found'
          print(f'**Result: {status}**')
          print()
          print('| Blockers | Warnings |')
          print('|---|---|')
          print(f'| {len(blockers)} | {len(warnings)} |')
          for title, rows in (('Blockers (would get the plugin closed on WP.org)', blockers), ('Warnings (review recommended)', warnings)):
              if not rows:
                  continue
              print()
              print(f'### {title}')
              print()
              print('| Category | File | Issue | How to fix |')
              print('|---|---|---|---|')
              for f in rows[:200]:
                  where = f"{f.get('file', '')}:{f.get('line', 0)}" if f.get('line') else f.get('file', '')
                  print(f"| {cell(f.get('category', ''), 40)} | `{cell(where, 120)}` | {cell(f.get('message', ''), 200)} | {cell(f.get('fix', ''), 150)} |")
              if len(rows) > 200:
                  print()
                  print(f'_{len(rows) - 200} more in the compliance-report artifact._')
          PY

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: |
            compliance-findings.json
            compliance-stderr.txt

  # ─── Job: AI review of the changed code ───
  ai-review:
    name: AI Review
    runs-on: ubuntu-latest
    if: ${{ inputs.ai-review }}
    outputs:
      status: ${{ steps.ai.outputs.ai_status }}
      blockers: ${{ steps.ai.outputs.ai_blockers }}
      warnings: ${{ steps.ai.outputs.ai_warnings }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Embedded like the checker above; this step must not contain any ${{ }} expression.
      - name: Write AI reviewer
        run: |
          # >>> embedded ai-review.py (generated by action/embed-checker.py, do not edit)
          cat > "$RUNNER_TEMP/ai-review.py" <<'WPPOOL_AI_REVIEW_EOF'
          #!/usr/bin/env python3
          """AI review of the plugin code changed by a commit or pull request, or of the whole plugin.

          Sends the diff (plus the full changed files, readme.txt and the main plugin file for context),
          the WPPOOL review rules and the reviewer skill's knowledge files to Claude
          (ANTHROPIC_API_KEY), OpenAI / ChatGPT (OPENAI_API_KEY) or Gemini (GEMINI_API_KEY) and writes:

            ai-findings.json   structured findings
            ai-report.md       Markdown report (run summary + PR comment)
            $GITHUB_OUTPUT     ai_status, ai_blockers, ai_warnings, ai_provider

          An API failure is reported as ai_status=error and never fails the job by itself, so a
          provider outage cannot block merges. Real findings are judged by the Compliance Gate.

          AUDIT_MODE=full reviews every shipped code file instead of the change, in batches.
          """

          import fnmatch
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          PLUGIN_DIR = os.environ.get('PLUGIN_DIR', '.') or '.'
          RULES_FILE = os.environ.get('RULES_FILE', 'ai-review-rules.md')
          EVENT = os.environ.get('EVENT_NAME', '')
          BEFORE = os.environ.get('BEFORE_SHA', '')
          HEAD = os.environ.get('HEAD_SHA', '') or 'HEAD'
          BASE_REF = os.environ.get('BASE_REF', '')
          REF_NAME = os.environ.get('REF_NAME', '')
          DEFAULT_BRANCH = os.environ.get('DEFAULT_BRANCH', '')
          TEXT_DOMAIN = os.environ.get('TEXT_DOMAIN', '')
          GEMINI_KEY = os.environ.get('GEMINI_API_KEY', '')
          ANTHROPIC_KEY = os.environ.get('ANTHROPIC_API_KEY', '')
          OPENAI_KEY = os.environ.get('OPENAI_API_KEY', '')
          # auto = the first provider with a key in PROVIDERS order; gemini / claude / openai = that one first.
          AI_PROVIDER = (os.environ.get('AI_PROVIDER', '') or 'auto').strip().lower()
          GEMINI_MODEL = os.environ.get('GEMINI_MODEL', '') or 'gemini-flash-lite-latest'
          CLAUDE_MODEL = os.environ.get('CLAUDE_MODEL', '') or 'claude-opus-5-5'
          OPENAI_MODEL = os.environ.get('OPENAI_MODEL', '') or 'gpt-5-mini'
          FULL_AUDIT = os.environ.get('AUDIT_MODE', '').lower() == 'full'

          # Reference material from the wppool-plugin-reviewer skill, appended to the rules.
          KNOWLEDGE_FILES = (
              'closure-case-studies.md',
              'compliant-trialware-pattern.md',
              'official-guidelines-and-pcp.md',
              'grep-patterns.md',
          )

          CODE_EXTENSIONS = ('.php', '.js', '.jsx', '.ts', '.tsx', '.mjs', '.vue')
          ALWAYS_SKIP = ('vendor/', 'node_modules/', '.git/', '.github/', 'build/', 'dist/')
          MAX_FILE_CHARS = 60000
          MAX_TOTAL_CHARS = 350000
          MAX_CONTEXT_CHARS = 40000
          BATCH_PAUSE_SECONDS = 45  # Keeps full audits under the Gemini free-tier tokens-per-minute limit.

          FINDINGS_SCHEMA = {
              'type': 'object',
              'properties': {
                  'summary': {'type': 'string'},
                  'findings': {
                      'type': 'array',
                      'items': {
                          'type': 'object',
                          'properties': {
                              'severity': {'type': 'string', 'enum': ['BLOCKER', 'WARNING']},
                              'category': {'type': 'string'},
                              'file': {'type': 'string'},
                              'line': {'type': 'integer'},
                              'message': {'type': 'string'},
                              'fix': {'type': 'string'},
                          },
                          'required': ['severity', 'category', 'file', 'line', 'message', 'fix'],
                          'additionalProperties': False,
                      },
                  },
              },
              'required': ['summary', 'findings'],
              'additionalProperties': False,
          }


          def git(*args):
              return subprocess.run(['git', *args], capture_output=True, text=True, errors='replace').stdout


          def git_ok(*args):
              return subprocess.run(['git', *args], capture_output=True, text=True).returncode == 0


          def set_output(**values):
              path = os.environ.get('GITHUB_OUTPUT')
              if not path:
                  return
              with open(path, 'a', encoding='utf-8') as fh:
                  for key, value in values.items():
                      fh.write(f'{key}={value}\n')


          def distignore_patterns():
              path = os.path.join(PLUGIN_DIR, '.distignore')
              if not os.path.isfile(path):
                  return []
              patterns = []
              for raw in open(path, encoding='utf-8', errors='replace'):
                  line = raw.strip()
                  if line and not line.startswith('#'):
                      patterns.append(line)
              return patterns


          def is_reviewable(rel, patterns):
              if not (rel.endswith(CODE_EXTENSIONS) or os.path.basename(rel) == 'readme.txt'):
                  return False
              if rel.endswith(('.min.js', '.min.css', '.asset.php', '.l10n.php')):
                  return False
              if any(('/' + rel).find('/' + skip) != -1 for skip in ALWAYS_SKIP):
                  return False
              for pattern in patterns:
                  glob = pattern.strip('/').replace('**', '*')
                  anchored = pattern.startswith('/')
                  candidates = [rel] if anchored else [rel] + ['/'.join(rel.split('/')[i:]) for i in range(1, rel.count('/') + 1)]
                  for cand in candidates:
                      if fnmatch.fnmatch(cand, glob) or fnmatch.fnmatch(cand, glob + '/*'):
                          return False
              return True


          def diff_range():
              """Return (base, head, description) for the change to review."""
              zero = '0' * 40
              if EVENT == 'pull_request' and BASE_REF:
                  git('fetch', '--no-tags', '--depth=200', 'origin', BASE_REF)
                  base = git('merge-base', f'origin/{BASE_REF}', HEAD).strip()
                  if base:
                      return base, HEAD, f'pull request against {BASE_REF}'
              if EVENT == 'push' and DEFAULT_BRANCH and REF_NAME and REF_NAME != DEFAULT_BRANCH:
                  # Feature branch: review everything the branch changes, like a pull request would.
                  git('fetch', '--no-tags', '--depth=200', 'origin', DEFAULT_BRANCH)
                  base = git('merge-base', f'origin/{DEFAULT_BRANCH}', HEAD).strip()
                  if base:
                      return base, HEAD, f'branch {REF_NAME} compared to {DEFAULT_BRANCH}'
              if EVENT == 'push' and BEFORE and BEFORE != zero and git_ok('cat-file', '-e', f'{BEFORE}^{{commit}}'):
                  return BEFORE, HEAD, 'commits in this push'
              if git_ok('rev-parse', '--verify', f'{HEAD}~1'):
                  return f'{HEAD}~1', HEAD, 'latest commit'
              return None, HEAD, 'first commit'


          def collect_changes():
              base, head, label = diff_range()
              patterns = distignore_patterns()
              prefix = os.path.normpath(PLUGIN_DIR).replace('\\', '/')
              prefix = '' if prefix in ('.', '') else prefix.rstrip('/') + '/'

              if base:
                  names = git('diff', '--name-only', '--diff-filter=AMR', base, head).splitlines()
              else:
                  names = git('ls-tree', '-r', '--name-only', head).splitlines()

              files = []
              for name in names:
                  if prefix and not name.startswith(prefix):
                      continue
                  rel = name[len(prefix):]
                  if is_reviewable(rel, patterns) and os.path.isfile(name):
                      files.append(name)

              parts, total, truncated = [], 0, []
              for name in files:
                  diff = git('diff', '--unified=8', base, head, '--', name) if base else ''
                  numbered = numbered_lines(name)
                  if len(numbered) > MAX_FILE_CHARS:
                      numbered = numbered[:MAX_FILE_CHARS] + '\n... (file truncated for length)'
                  block = f'### FILE: {name}\n\n#### Diff\n```diff\n{diff or "(new file / no diff available)"}\n```\n\n#### Full file (new version, with line numbers)\n```\n{numbered}\n```\n'
                  if total + len(block) > MAX_TOTAL_CHARS:
                      truncated.append(name)
                      continue
                  parts.append(block)
                  total += len(block)
              return files, parts, truncated, label


          def plugin_prefix():
              prefix = os.path.normpath(PLUGIN_DIR).replace('\\', '/')
              return '' if prefix in ('.', '') else prefix.rstrip('/') + '/'


          def numbered_lines(name):
              try:
                  content = open(name, encoding='utf-8', errors='replace').read()
              except OSError:
                  content = ''
              return '\n'.join(f'{i + 1:5d}| {line}' for i, line in enumerate(content.splitlines()))


          def main_plugin_file():
              prefix = plugin_prefix()
              root = prefix or '.'
              for entry in sorted(os.listdir(root)):
                  path = os.path.join(root, entry)
                  if entry.endswith('.php') and os.path.isfile(path):
                      with open(path, encoding='utf-8', errors='replace') as fh:
                          if 'Plugin Name:' in fh.read(8192):
                              return prefix + entry
              return ''


          def context_blocks(skip):
              """readme.txt and the main plugin file, so the AI can check documentation and headers."""
              blocks = []
              for name in (plugin_prefix() + 'readme.txt', main_plugin_file()):
                  if not name or name in skip or not os.path.isfile(name):
                      continue
                  numbered = numbered_lines(name)
                  if len(numbered) > MAX_CONTEXT_CHARS:
                      numbered = numbered[:MAX_CONTEXT_CHARS] + '\n... (truncated)'
                  blocks.append(f'### CONTEXT FILE (unchanged, for reference): {name}\n```\n{numbered}\n```\n')
              return blocks


          def collect_audit():
              """Every shipped code file, split into batches that fit one request."""
              patterns = distignore_patterns()
              prefix = plugin_prefix()
              files = []
              for name in git('ls-files').splitlines():
                  if prefix and not name.startswith(prefix):
                      continue
                  rel = name[len(prefix):]
                  if is_reviewable(rel, patterns) and os.path.isfile(name):
                      files.append(name)

              batches, current, size = [], [], 0
              for name in files:
                  chunks, chunk, chunk_size = [], [], 0
                  for line in numbered_lines(name).split('\n'):
                      if chunk and chunk_size + len(line) > MAX_FILE_CHARS:
                          chunks.append('\n'.join(chunk))
                          chunk, chunk_size = [], 0
                      chunk.append(line)
                      chunk_size += len(line) + 1
                  chunks.append('\n'.join(chunk))
                  for i, text in enumerate(chunks):
                      part = f' (part {i + 1} of {len(chunks)})' if len(chunks) > 1 else ''
                      block = f'### FILE: {name}{part}\n```\n{text}\n```\n'
                      if current and size + len(block) > MAX_TOTAL_CHARS:
                          batches.append(current)
                          current, size = [], 0
                      current.append(block)
                      size += len(block)
              if current:
                  batches.append(current)
              return files, batches


          def build_prompt(parts, truncated, label, context=(), batch=''):
              if FULL_AUDIT:
                  lines = [
                      f'FULL PLUGIN AUDIT{batch}: there is no diff. Review ALL the code shown below as if it were about to',
                      'be submitted to WordPress.org; the "review only the changed code" rule does not apply.',
                  ]
              else:
                  lines = [f'Review the following WordPress plugin changes ({label}).']
              lines += [
                  f'Plugin text domain / slug: {TEXT_DOMAIN or "(not provided)"}.',
                  'Return JSON matching this shape: {"summary": string, "findings": [{"severity": "BLOCKER"|"WARNING", '
                  '"category": string, "file": string, "line": integer, "message": string, "fix": string}]}.',
                  'Use the exact file paths shown after "FILE:" and the line numbers shown in the listing.',
                  'CONTEXT FILEs are reference only (for example: is an external service documented in readme.txt?). '
                  'Report a missing readme disclosure at the code line that contacts the service.',
              ]
              if not FULL_AUDIT:
                  lines.append('Report only real problems in the changed code.')
              lines.append('')
              if truncated:
                  lines.append('These changed files were too large to include and were not reviewed: ' + ', '.join(truncated))
                  lines.append('')
              return '\n'.join(lines) + '\n'.join(list(context) + list(parts))


          def load_rules():
              rules = open(RULES_FILE, encoding='utf-8').read()
              here = os.path.dirname(os.path.abspath(__file__))
              folders = [os.environ.get('KNOWLEDGE_DIR', ''), os.path.dirname(os.path.abspath(RULES_FILE)),
                         os.path.join(here, '..', 'knowledge')]
              extra = []
              for name in KNOWLEDGE_FILES:
                  for folder in folders:
                      path = os.path.join(folder, name) if folder else ''
                      if path and os.path.isfile(path):
                          extra.append(f'\n\n---\n\n# Reference: {name}\n\n' + open(path, encoding='utf-8').read())
                          break
              if extra:
                  rules += ('\n\n## 6. Reference knowledge from the WPPOOL reviewer skill\n\n'
                            'The documents below are the detailed sources behind the rules above: real closure emails, '
                            'the compliant free/pro pattern, the official guidelines and Plugin Check rules. Use them to '
                            'judge borderline cases; the rules above still decide what is a BLOCKER.' + ''.join(extra))
              return rules


          def http_json(url, payload, headers, timeout=300):
              data = json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json', **headers})
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return json.loads(resp.read().decode('utf-8'))


          def pick_gemini_model(lite=False):
              """Newest available Flash model (or Flash-Lite) for when the configured one is missing or out of quota."""
              req = urllib.request.Request('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',
                                           headers={'x-goog-api-key': GEMINI_KEY})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  models = json.loads(resp.read().decode('utf-8')).get('models', [])
              usable = [m['name'].split('/', 1)[-1] for m in models
                        if 'generateContent' in m.get('supportedGenerationMethods', [])
                        and 'flash' in m['name'] and (('lite' in m['name']) == lite)
                        and not any(x in m['name'] for x in ('tts', 'image', 'live', 'embedding', 'audio', 'exp', 'preview'))]
              return sorted(usable)[-1] if usable else None


          def review_with_gemini(rules, prompt):
              model = GEMINI_MODEL
              tried_lite = False
              payload = {
                  'systemInstruction': {'parts': [{'text': rules}]},
                  'contents': [{'role': 'user', 'parts': [{'text': prompt}]}],
                  'generationConfig': {'temperature': 0.1, 'responseMimeType': 'application/json'},
              }
              for attempt in range(5):
                  url = f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent'
                  try:
                      data = http_json(url, payload, {'x-goog-api-key': GEMINI_KEY})
                      text = ''.join(p.get('text', '') for p in data['candidates'][0]['content']['parts'])
                      return json.loads(text), f'gemini ({model})'
                  except urllib.error.HTTPError as err:
                      body = err.read().decode('utf-8', 'replace')
                      print(f'Gemini API error {err.code} for {model}:')
                      print(body)
                      if err.code == 404 and attempt == 0:
                          fallback = pick_gemini_model()
                          if fallback and fallback != model:
                              print(f'Gemini model {model} not available; using {fallback}.')
                              model = fallback
                              continue
                      if err.code == 429 and 'quota' in body.lower() and not tried_lite:
                          # Out of quota for this model (often: free tier has none): try Flash-Lite once.
                          tried_lite = True
                          lite = pick_gemini_model(lite=True)
                          if lite and lite != model:
                              print(f'Out of quota for {model}; trying {lite}.')
                              model = lite
                              continue
                      if err.code in (429, 500, 503) and attempt < 3:
                          time.sleep(15 * (attempt + 1))
                          continue
                      first = json.loads(body).get('error', {}).get('message', body) if body.startswith('{') else body
                      raise RuntimeError(f'Gemini API error {err.code}: {first[:400]}')
              raise RuntimeError('Gemini API kept failing')


          def pick_openai_model():
              """Newest available GPT 'mini' chat model, for when the configured one does not exist."""
              req = urllib.request.Request('https://api.openai.com/v1/models',
                                           headers={'Authorization': f'Bearer {OPENAI_KEY}'})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  models = [m.get('id', '') for m in json.loads(resp.read().decode('utf-8')).get('data', [])]
              usable = [m for m in models if m.startswith('gpt-') and 'mini' in m
                        and not any(x in m for x in ('audio', 'realtime', 'search', 'transcribe', 'tts', 'image', 'nano'))]
              return sorted(usable)[-1] if usable else None


          def review_with_openai(rules, prompt):
              model = OPENAI_MODEL
              for attempt in range(5):
                  payload = {
                      'model': model,
                      'messages': [{'role': 'system', 'content': rules}, {'role': 'user', 'content': prompt}],
                      'response_format': {'type': 'json_object'},
                  }
                  try:
                      data = http_json('https://api.openai.com/v1/chat/completions', payload,
                                       {'Authorization': f'Bearer {OPENAI_KEY}'})
                      choice = data['choices'][0]
                      if choice.get('finish_reason') == 'length':
                          raise RuntimeError('OpenAI response was cut off (output too long)')
                      return json.loads(choice['message']['content']), f"openai ({data.get('model', model)})"
                  except urllib.error.HTTPError as err:
                      body = err.read().decode('utf-8', 'replace')
                      print(f'OpenAI API error {err.code} for {model}:')
                      print(body)
                      if err.code == 404 and attempt == 0:
                          fallback = pick_openai_model()
                          if fallback and fallback != model:
                              print(f'OpenAI model {model} not available; using {fallback}.')
                              model = fallback
                              continue
                      if err.code == 429 and 'insufficient_quota' in body:
                          raise RuntimeError('OpenAI account has no credit (insufficient_quota)')
                      if err.code in (429, 500, 502, 503) and attempt < 3:
                          time.sleep(15 * (attempt + 1))
                          continue
                      first = json.loads(body).get('error', {}).get('message', body) if body.startswith('{') else body
                      raise RuntimeError(f'OpenAI API error {err.code}: {first[:400]}')
              raise RuntimeError('OpenAI API kept failing')


          def review_with_claude(rules, prompt):
              import anthropic

              client = anthropic.Anthropic(api_key=ANTHROPIC_KEY, max_retries=3)
              response = client.beta.messages.create(
                  model=CLAUDE_MODEL,
                  max_tokens=16000,
                  betas=['server-side-fallback-2026-07-01'],
                  fallbacks='default',
                  system=rules,
                  output_config={'effort': 'high', 'format': {'type': 'json_schema', 'schema': FINDINGS_SCHEMA}},
                  messages=[{'role': 'user', 'content': prompt}],
              )
              if response.stop_reason == 'refusal':
                  raise RuntimeError('Claude declined to review this change (refusal).')
              text = next(block.text for block in response.content if block.type == 'text')
              return json.loads(text), f'claude ({response.model})'


          def clean(findings, files):
              out = []
              for f in findings if isinstance(findings, list) else []:
                  if not isinstance(f, dict):
                      continue
                  severity = str(f.get('severity', 'WARNING')).upper()
                  try:
                      line = int(f.get('line') or 0)
                  except (TypeError, ValueError):
                      line = 0
                  out.append({
                      'severity': 'BLOCKER' if severity == 'BLOCKER' else 'WARNING',
                      'category': str(f.get('category', 'AI review'))[:60],
                      'file': str(f.get('file', '')),
                      'line': line,
                      'message': str(f.get('message', '')).strip(),
                      'fix': str(f.get('fix', '')).strip(),
                  })
              order = {'BLOCKER': 0, 'WARNING': 1}
              return sorted(out, key=lambda x: (order[x['severity']], x['file'], x['line']))


          def cell(value, limit):
              return str(value).replace('|', '\\|').replace('\n', ' ')[:limit]


          def write_report(status, provider, summary, findings, files, truncated, label, note=''):
              blockers = [f for f in findings if f['severity'] == 'BLOCKER']
              warnings = [f for f in findings if f['severity'] == 'WARNING']
              md = ['## AI Review (WP.org rules + security)', '']
              if status == 'skipped':
                  md.append(note or 'Skipped.')
              elif status == 'error':
                  md.append(f':warning: The AI review could not run: {cell(note, 400)}')
                  md.append('')
                  md.append('This does not block the merge; the pattern-based checks above still apply.')
              elif not files:
                  md.append(summary or 'No reviewable plugin code changed.')
              else:
                  result = 'FAIL: fix the AI-reported blockers before merging' if blockers else 'PASS: no blockers found by the AI review'
                  done = len(files) - len(truncated)
                  scope = (f'{done} of {len(files)} file(s) ({label})' if FULL_AUDIT and truncated
                           else f'{len(files)} file(s) ({label})' if FULL_AUDIT
                           else f'{len(files)} changed file(s) in the {label}')
                  md += [f'**Result: {result}**', '', f'Reviewed {scope} with {provider}.', '']
                  if summary:
                      md += [cell(summary, 1500), '']
                  md += ['| Blockers | Warnings |', '|---|---|', f'| {len(blockers)} | {len(warnings)} |']
                  for title, rows in (('Blockers', blockers), ('Warnings', warnings)):
                      if rows:
                          md += ['', f'### {title}', '', '| Category | File | Issue | How to fix |', '|---|---|---|---|']
                          for f in rows[:100]:
                              where = f"{f['file']}:{f['line']}" if f['line'] else f['file']
                              md.append(f"| {cell(f['category'], 40)} | `{cell(where, 120)}` | {cell(f['message'], 400)} | {cell(f['fix'], 300)} |")
                  if truncated:
                      why = 'the request for these files failed' if FULL_AUDIT else 'too large'
                      md += ['', f'Not reviewed ({why}): ' + ', '.join(f'`{t}`' for t in truncated)]
                  md += ['', '_AI findings can be wrong. If a blocker is a false positive, explain it in the PR and ask a maintainer to override._']
              report = '\n'.join(md) + '\n'
              open('ai-report.md', 'w', encoding='utf-8').write(report)
              json.dump({'status': status, 'provider': provider, 'summary': summary, 'findings': findings},
                        open('ai-findings.json', 'w', encoding='utf-8'), indent=2)
              summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_path:
                  open(summary_path, 'a', encoding='utf-8').write(report)
              set_output(ai_status=status, ai_blockers=len(blockers), ai_warnings=len(warnings), ai_provider=provider or 'none')
              print(report)


          # Order used by ai-provider=auto and for fallbacks.
          PROVIDERS = ('claude', 'openai', 'gemini')


          def provider_order():
              """Providers to try, preferred first; only those with a key. The rest are fallbacks."""
              available = {'claude': bool(ANTHROPIC_KEY), 'openai': bool(OPENAI_KEY), 'gemini': bool(GEMINI_KEY)}
              if AI_PROVIDER not in ('auto',) + PROVIDERS:
                  print(f'Unknown ai-provider "{AI_PROVIDER}"; using auto.')
              order = list(PROVIDERS)
              if AI_PROVIDER in PROVIDERS:
                  order.remove(AI_PROVIDER)
                  order.insert(0, AI_PROVIDER)
                  if not available[AI_PROVIDER]:
                      print(f'ai-provider is {AI_PROVIDER} but its API key is not set; using the next provider with a key.')
              return [name for name in order if available[name]]


          def review(rules, prompt):
              errors = []
              for name in provider_order():
                  try:
                      if name == 'claude':
                          return review_with_claude(rules, prompt)
                      if name == 'openai':
                          return review_with_openai(rules, prompt)
                      return review_with_gemini(rules, prompt)
                  except Exception as err:  # noqa: BLE001 - try the other provider before giving up
                      print(f'{name} review failed: {err}')
                      errors.append(f'{name}: {err}')
              raise RuntimeError('; '.join(errors) or 'no AI provider available')


          def run_audit(rules):
              files, batches = collect_audit()
              label = 'full plugin audit'
              if not files:
                  write_report('ok', 'none', 'No reviewable plugin code found.', [], [], [], label)
                  return
              context = context_blocks(set())
              findings, summaries, provider = [], [], ''
              pending = list(enumerate(batches))
              for attempt in range(2):
                  retry = []
                  for n, (i, batch) in enumerate(pending):
                      if (n or attempt) and provider_order()[:1] == ['gemini']:
                          time.sleep(BATCH_PAUSE_SECONDS)
                      names = sorted({b.split('\n', 1)[0].replace('### FILE: ', '').split(' (part ')[0] for b in batch})
                      print(f'Audit batch {i + 1}/{len(batches)}: {len(names)} file(s)' + (' (retry)' if attempt else ''))
                      tag = f' (batch {i + 1} of {len(batches)})' if len(batches) > 1 else ''
                      try:
                          result, provider = review(rules, build_prompt(batch, [], label, context, tag))
                      except Exception as err:  # noqa: BLE001 - keep going; report what could not be reviewed
                          print(f'Batch {i + 1} failed: {err}')
                          retry.append((i, batch))
                          continue
                      if isinstance(result.get('findings'), list):
                          findings += result['findings']
                      if result.get('summary'):
                          summaries.append(str(result['summary']))
                  # Retry in halves: a request that keeps failing is often just too big for the model.
                  pending = [(i, part) for i, batch in retry
                             for part in ((batch[:len(batch) // 2], batch[len(batch) // 2:]) if len(batch) > 1 else (batch,))]
                  if not pending:
                      break
                  if attempt == 0:
                      # Provider overload (503) or rate limits usually clear within a couple of minutes.
                      print(f'{len(retry)} batch(es) failed; retrying in {len(pending)} smaller request(s) in 2 minutes.')
                      time.sleep(120)
              failed = sorted({b.split('\n', 1)[0].replace('### FILE: ', '').split(' (part ')[0]
                               for _, batch in pending for b in batch})
              if len(failed) == len(files):
                  write_report('error', '', '', [], files, [], label, 'every audit batch failed; see the job log')
                  return
              write_report('ok', provider, ' '.join(summaries), clean(findings, files), files, failed, label)


          def main():
              if not GEMINI_KEY and not ANTHROPIC_KEY and not OPENAI_KEY:
                  write_report('skipped', '', '', [], [], [], '', 'No AI key configured (add a GEMINI_API_KEY, OPENAI_API_KEY or ANTHROPIC_API_KEY secret to enable the AI review).')
                  return
              rules = load_rules()
              if FULL_AUDIT:
                  run_audit(rules)
                  return
              files, parts, truncated, label = collect_changes()
              if not files:
                  write_report('ok', 'none', 'No reviewable plugin code changed in this commit.', [], [], [], label)
                  return
              prompt = build_prompt(parts, truncated, label, context_blocks(set(files)))
              try:
                  result, provider = review(rules, prompt)
              except Exception as err:  # noqa: BLE001 - any provider failure is reported, not fatal
                  write_report('error', '', '', [], files, truncated, label, str(err))
                  return
              write_report('ok', provider, str(result.get('summary', '')), clean(result.get('findings', []), files), files, truncated, label)


          if __name__ == '__main__':
              sys.exit(main())
          WPPOOL_AI_REVIEW_EOF
