  # ─── Job 3: Post PR Comment ───
  comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [phpcs, wporg-compliance, ai-review]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Download compliance report
        uses: actions/download-artifact@v4
        with:
          name: compliance-report
          path: reports

      - name: Download PHPCS report
        uses: actions/download-artifact@v4
        with:
          name: phpcs-report
          path: reports
        continue-on-error: true

      - name: Download AI review report
        uses: actions/download-artifact@v4
        with:
          name: ai-review-report
          path: reports
        continue-on-error: true

      - name: Generate and post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let findings = [];
            try {
              const raw = fs.readFileSync('reports/compliance-findings.json', 'utf8');
              findings = JSON.parse(raw);
            } catch (e) {
              console.log('No findings file found');
            }

            let phpcsReport = '';
            try {
              phpcsReport = fs.readFileSync('reports/phpcs-summary.txt', 'utf8');
            } catch (e) {
              console.log('No PHPCS report found');
            }

            const blockers = findings.filter(f => f.severity === 'BLOCKER');
            const warnings = findings.filter(f => f.severity === 'WARNING');
            const infos = findings.filter(f => f.severity === 'INFO');

            const result = '${{ needs.wporg-compliance.outputs.result }}';
            const emoji = result === 'FAIL' ? '🚫' : (warnings.length > 0 ? '⚠️' : '✅');

            let body = `## ${emoji} WP.org Compliance Check\n\n`;
            body += `| Metric | Count |\n|---|---|\n`;
            body += `| Blockers | **${blockers.length}** |\n`;
            body += `| Warnings | ${warnings.length} |\n`;
            body += `| Info | ${infos.length} |\n\n`;

            if (blockers.length > 0) {
              body += `### 🚫 Blockers (will cause WP.org closure)\n\n`;
              body += `| Category | File | Issue | Fix |\n|---|---|---|---|\n`;
              for (const f of blockers) {
                const file = f.line > 0 ? `\`${f.file}:${f.line}\`` : `\`${f.file}\``;
                const msg = f.message.replace(/\|/g, '\\|').substring(0, 200);
                const fix = (f.fix || '').replace(/\|/g, '\\|').substring(0, 150);
                body += `| ${f.category} | ${file} | ${msg} | ${fix} |\n`;
              }
              body += `\n`;
            }

            if (warnings.length > 0) {
              body += `### ⚠️ Warnings (may cause closure)\n\n`;
              body += `| Category | File | Issue | Fix |\n|---|---|---|---|\n`;
              for (const f of warnings) {
                const file = f.line > 0 ? `\`${f.file}:${f.line}\`` : `\`${f.file}\``;
                const msg = f.message.replace(/\|/g, '\\|').substring(0, 200);
                const fix = (f.fix || '').replace(/\|/g, '\\|').substring(0, 150);
                body += `| ${f.category} | ${file} | ${msg} | ${fix} |\n`;
              }
              body += `\n`;
            }

            if (blockers.length === 0 && warnings.length === 0) {
              body += `### ✅ All clear!\n\nNo WP.org compliance issues detected.\n\n`;
            }

            if (phpcsReport) {
              body += `<details>\n<summary>PHPCS Summary</summary>\n\n\`\`\`\n${phpcsReport.substring(0, 3000)}\n\`\`\`\n</details>\n\n`;
            }

            try {
              body += fs.readFileSync('reports/ai-report.md', 'utf8').substring(0, 30000) + `\n`;
            } catch (e) {
              console.log('No AI review report found');
            }

            body += `---\n*Powered by [WPPOOL Plugin Reviewer](https://github.com/WPPOOL/wppool-plugin-reviewer)*`;

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.body && c.body.includes('WP.org Compliance Check') &&
              c.body.includes('WPPOOL Plugin Reviewer')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  # ─── Job 4: Set Check Status ───
  status:
    name: Compliance Gate
    runs-on: ubuntu-latest
    needs: [wporg-compliance, ai-review]
    if: always()
    steps:
      - name: Check result
        run: |
          AI_JOB="${{ needs.ai-review.result }}"
          AI_STATUS="${{ needs.ai-review.outputs.status }}"
          AI_BLOCKERS="${{ needs.ai-review.outputs.blockers }}"
          FAIL_ON_AI="${{ inputs.fail-on-ai-blockers }}"

          RESULT="${{ needs.wporg-compliance.outputs.result }}"
          BLOCKERS="${{ needs.wporg-compliance.outputs.blockers }}"
          WARNINGS="${{ needs.wporg-compliance.outputs.warnings }}"

          JOB_RESULT="${{ needs.wporg-compliance.result }}"

          echo "Compliance job: $JOB_RESULT"
          echo "Result: $RESULT"
          echo "Blockers: $BLOCKERS"
          echo "Warnings: $WARNINGS"

          # A checker that crashed or never ran must not pass the gate.
          if [ "$JOB_RESULT" != "success" ] || [ -z "$RESULT" ]; then
            echo "::error::WP.org compliance check did not complete (job result: $JOB_RESULT). See the 'WP.org Compliance' job log."
            exit 1
          fi

          if [ "$RESULT" = "FAIL" ]; then
            echo "::error::WP.org compliance check failed with $BLOCKERS blocker(s). PR cannot be merged."
            exit 1
          fi

          echo "AI review job: $AI_JOB (status: ${AI_STATUS:-n/a}, blockers: ${AI_BLOCKERS:-0})"
          # A provider outage or missing key must not block merges; real findings do.
          if [ "$AI_JOB" = "failure" ] || [ "$AI_STATUS" = "error" ]; then
            echo "::warning::The AI review did not complete. See the 'AI Review' job log."
          fi
          if [ "$FAIL_ON_AI" = "true" ] && [ "${AI_BLOCKERS:-0}" -gt 0 ]; then
            echo "::error::The AI review found $AI_BLOCKERS blocker(s). See the AI Review section of the run summary."
            exit 1
          fi
