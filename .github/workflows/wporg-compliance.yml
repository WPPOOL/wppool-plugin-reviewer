name: WP.org Compliance Check

on:
  workflow_call:
    inputs:
      plugin-dir:
        description: 'Path to plugin directory (relative to repo root)'
        required: false
        type: string
        default: '.'
      php-version:
        description: 'PHP version for PHPCS'
        required: false
        type: string
        default: '8.0'
      fail-on-warnings:
        description: 'Fail the check on warnings (not just blockers)'
        required: false
        type: boolean
        default: false
      phpcs-standard:
        description: 'PHPCS standard to use'
        required: false
        type: string
        default: 'WordPress-Extra'
      plugin-text-domain:
        description: 'Plugin text domain for PHPCS prefix check'
        required: false
        type: string
        default: ''
      ai-review:
        description: 'Run the AI review of changed code (needs GEMINI_API_KEY or ANTHROPIC_API_KEY)'
        required: false
        type: boolean
        default: true
      fail-on-ai-blockers:
        description: 'Fail the Compliance Gate when the AI review reports blockers'
        required: false
        type: boolean
        default: true
      gemini-model:
        description: 'Gemini model for the AI review (default: gemini-flash-lite-latest, which has free-tier quota; set a stronger model if billing is enabled)'
        required: false
        type: string
        default: ''
      claude-model:
        description: 'Claude model for the AI review (default: claude-opus-5-5); used when ANTHROPIC_API_KEY is set'
        required: false
        type: string
        default: ''
    secrets:
      GEMINI_API_KEY:
        description: 'Google Gemini API key for the AI review (optional)'
        required: false
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for the AI review (optional; preferred over Gemini when both are set)'
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ─── Job 1: PHPCS + WordPress Coding Standards ───
  phpcs:
    name: PHPCS / WordPress Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: cs2pr, phpcs, phpcbf

      - name: Install WordPress Coding Standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev wp-coding-standards/wpcs:"^3.0" phpcompatibility/phpcompatibility-wp:"*" dealerdirect/phpcodesniffer-composer-installer:"^1.0"
          phpcs -i

      - name: Run PHPCS
        id: phpcs
        continue-on-error: true
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.plugin-text-domain }}" ]; then
            EXTRA_ARGS="--runtime-set text_domain ${{ inputs.plugin-text-domain }}"
          fi

          # Skip what never ships to WP.org: dependencies, build output, tests, docs,
          # generated files, plus everything in the plugin's .distignore.
          IGNORE="*/vendor/*,*/node_modules/*,*/build/*,*/dist/*,*/tests/*,*/test/*,*/docs/*,*/ai-docs/*,*/.github/*,*/languages/*,*.min.js,*.asset.php"
          DISTIGNORE="${{ inputs.plugin-dir }}/.distignore"
          if [ -f "$DISTIGNORE" ]; then
            while IFS= read -r pattern || [ -n "$pattern" ]; do
              pattern="$(echo "$pattern" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -z "$pattern" ] && continue
              case "$pattern" in \#*) continue ;; esac
              pattern="${pattern#/}"
              pattern="${pattern%/}"
              pattern="${pattern//\*\*/*}"
              IGNORE="$IGNORE,*/$pattern/*,*/$pattern"
            done < "$DISTIGNORE"
          fi
          echo "PHPCS ignores: $IGNORE"

          phpcs \
            --standard=${{ inputs.phpcs-standard }} \
            --extensions=php \
            --ignore="$IGNORE"             --basepath="${{ inputs.plugin-dir }}" \
            --report=checkstyle \
            --report-file=phpcs-report.xml \
            $EXTRA_ARGS \
            ${{ inputs.plugin-dir }} || true

          # Also generate human-readable report
          phpcs \
            --standard=${{ inputs.phpcs-standard }} \
            --extensions=php \
            --ignore="$IGNORE"             --basepath="${{ inputs.plugin-dir }}" \
            --report=summary \
            $EXTRA_ARGS \
            ${{ inputs.plugin-dir }} > phpcs-summary.txt 2>&1 || true

          cat phpcs-summary.txt

      - name: Convert PHPCS to PR annotations
        if: always()
        run: |
          if [ -f phpcs-report.xml ]; then
            cs2pr phpcs-report.xml || true
          fi

      - name: Write PHPCS report to run summary
        if: always()
        run: |
          {
            echo "## PHPCS / WordPress Coding Standards"
            echo ""
            echo "Style findings are informational and do not fail the check."
            echo ""
            echo '```'
            if [ -f phpcs-summary.txt ]; then head -c 60000 phpcs-summary.txt; else echo "No PHPCS report was produced."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PHPCS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpcs-report
          path: |
            phpcs-report.xml
            phpcs-summary.txt

  # ─── Job 2: WP.org Compliance Grep Checks ───
  wporg-compliance:
    name: WP.org Compliance
    runs-on: ubuntu-latest
    outputs:
      blockers: ${{ steps.check.outputs.blockers }}
      warnings: ${{ steps.check.outputs.warnings }}
      result: ${{ steps.check.outputs.result }}
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      # The checker is embedded instead of checked out: calling repositories get a
      # GITHUB_TOKEN that cannot read this private repository. This step must not
      # contain any ${{ }} expression: a run block with an expression is limited
      # to 21,000 characters, and the embedded script is longer than that.
      - name: Write compliance checker
        run: |
          # >>> embedded check-wporg-compliance.sh (generated by action/embed-checker.py, do not edit)
          cat > "$RUNNER_TEMP/check-wporg-compliance.sh" <<'WPPOOL_CHECKER_EOF'
          #!/bin/bash
          # WP.org Compliance Checker - Grep-based checks that PHPCS doesn't catch
          # Used by GitHub Actions workflow for PR review
          #
          # Usage: ./check-wporg-compliance.sh /path/to/plugin
          # Output: JSON findings to stdout, human-readable to stderr

          set -euo pipefail

          PLUGIN_DIR="${1:-.}"
          FINDINGS_FILE=$(mktemp)
          EXIT_CODE=0

          # Colors for stderr output
          RED='\033[0;31m'
          YELLOW='\033[1;33m'
          GREEN='\033[0;32m'
          NC='\033[0m'

          # Track counts
          BLOCKERS=0
          WARNINGS=0
          INFO_COUNT=0

          # ─── Helper Functions ───

          # Escape a value for use inside a JSON string.
          json_escape() {
              printf '%s' "$1" | tr -d '\r' | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/\t/\\t/g' | tr -d '\000-\010\013\014\016-\037' | tr '\n' ' '
          }

          add_finding() {
              local severity="$1"  # BLOCKER, WARNING, INFO
              local category="$2"
              local file="$3"
              local line="$4"
              local message="$5"
              local fix="${6:-}"

              echo "{\"severity\":\"$severity\",\"category\":\"$category\",\"file\":\"$(json_escape "$file")\",\"line\":${line:-0},\"message\":\"$(json_escape "$message")\",\"fix\":\"$(json_escape "$fix")\"}" >> "$FINDINGS_FILE"

              case "$severity" in
                  BLOCKER) ((BLOCKERS++)) || true; echo -e "${RED}[BLOCKER]${NC} $category | $file:$line | $message" >&2 ;;
                  WARNING) ((WARNINGS++)) || true; echo -e "${YELLOW}[WARNING]${NC} $category | $file:$line | $message" >&2 ;;
                  INFO)    ((INFO_COUNT++)) || true; echo -e "${GREEN}[INFO]${NC} $category | $file:$line | $message" >&2 ;;
              esac
          }

          # Paths that never ship to WP.org: dependency folders, VCS/CI folders and
          # everything listed in the plugin's .distignore (tests/, docs/, build tooling...).
          DISTIGNORE_PATTERNS=()
          if [ -f "$PLUGIN_DIR/.distignore" ]; then
              while IFS= read -r pattern || [ -n "$pattern" ]; do
                  pattern="${pattern%$'\r'}"
                  pattern="${pattern#"${pattern%%[![:space:]]*}"}"
                  pattern="${pattern%"${pattern##*[![:space:]]}"}"
                  [[ -z "$pattern" || "$pattern" == \#* ]] && continue
                  DISTIGNORE_PATTERNS+=("$pattern")
              done < "$PLUGIN_DIR/.distignore"
          fi

          skip_path() {
              local rel="${1#"$PLUGIN_DIR"/}"
              rel="${rel#./}"
              case "/$rel" in
                  */vendor/*|*/node_modules/*|*/.git/*|*/.github/*) return 0 ;;
              esac
              local pattern glob
              for pattern in "${DISTIGNORE_PATTERNS[@]+"${DISTIGNORE_PATTERNS[@]}"}"; do
                  glob="${pattern#/}"
                  glob="${glob%/}"
                  glob="${glob//\*\*/*}"
                  if [[ "$pattern" == /* ]]; then
                      # Anchored to the plugin root: the path itself or anything below it.
                      [[ "$rel" == $glob || "$rel" == $glob/* ]] && return 0
                  else
                      # Unanchored: may match at any depth.
                      [[ "$rel" == $glob || "$rel" == $glob/* || "$rel" == */$glob || "$rel" == */$glob/* ]] && return 0
                  fi
              done
              return 1
          }

          # ─── CHECK 1: Trialware / Guideline 5 ───

          echo -e "\n=== Category 1: Trialware (Guideline 5) ===" >&2

          # is_pro / is_premium gates in PHP (not in comments, not in wp_localize_script)
          while IFS=: read -r file line content; do
              # Skip vendor/node_modules
              skip_path "$file" && continue
              # Skip comment lines
              trimmed=$(echo "$content" | sed 's/^[ \t]*//')
              [[ "$trimmed" == //* || "$trimmed" == \** || "$trimmed" == \#* ]] && continue
              # Skip wp_localize_script lines (allowed use)
              [[ "$content" == *wp_localize_script* ]] && continue
              # Skip class property definitions
              [[ "$content" == *"private "* || "$content" == *"protected "* || "$content" == *"public "* ]] && [[ "$content" == *'$is_pro'* || "$content" == *'$is_premium'* || "$content" == *'$is_ultimate'* ]] && [[ "$content" != *"if"* && "$content" != *"return"* ]] && continue

              # Flag if used in conditional (if/ternary/return)
              if echo "$content" | grep -qE '(if|return|&&|\|\||[\?:])\s*.*\b(is_pro|is_premium|is_ultimate|license_status|can_use_premium)\b'; then
                  add_finding "BLOCKER" "G5-Trialware" "$file" "$line" "License check gates functionality: $(echo "$content" | head -c 120)" "Remove gate; use apply_filters() with real default"
              fi
          done < <(grep -rnE '\b(is_pro|is_premium|is_ultimate|license_status|can_use_premium)\b' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # apply_filters with bad defaults (null, false, [], '' used as lock)
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              if echo "$content" | grep -qE "apply_filters\s*\(\s*['\"][^'\"]+['\"]\s*,\s*(null|false|\[\]|''|\"\")\s*[,)]"; then
                  add_finding "WARNING" "G5-Trialware" "$file" "$line" "apply_filters() with potentially locking default (null/false/[]/empty): $(echo "$content" | head -c 120)" "Use real working default value"
              fi
          done < <(grep -rnE "apply_filters\s*\(" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── CHECK 2: External Services ───

          echo -e "\n=== Category 2: External Services (G6/G7/G8) ===" >&2

          # Count external HTTP calls
          EXT_CALLS=$(grep -rn "wp_remote_get\|wp_remote_post\|wp_remote_request\|wp_remote_head\|file_get_contents\s*(\s*['\"]http" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ | wc -l || echo "0")

          # Check if readme has External services section
          HAS_EXT_SECTION=false
          if [ -f "$PLUGIN_DIR/readme.txt" ]; then
              grep -qi "external services\|third.party services\|external api" "$PLUGIN_DIR/readme.txt" && HAS_EXT_SECTION=true
          fi

          if [ "$EXT_CALLS" -gt 0 ] && [ "$HAS_EXT_SECTION" = false ]; then
              add_finding "BLOCKER" "G6-External-Services" "readme.txt" "0" "Plugin makes $EXT_CALLS external HTTP calls but readme.txt has no == External services == section" "Add == External services == with URL, purpose, data sent, ToS + privacy links"
          fi

          # Remote JS/CSS loading
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              if echo "$content" | grep -qE "(wp_enqueue_script|wp_enqueue_style|wp_register_script|wp_register_style).*https?://"; then
                  add_finding "BLOCKER" "G8-Remote-Resources" "$file" "$line" "Remote JS/CSS loading detected (must bundle locally): $(echo "$content" | head -c 120)" "Download and bundle file locally"
              fi
          done < <(grep -rnE "(wp_enqueue_script|wp_enqueue_style|wp_register_script|wp_register_style)" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep "http" | grep -v vendor/ | grep -v node_modules/ || true)

          # Tracking without opt-in check
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "WARNING" "G7-Tracking" "$file" "$line" "Telemetry/tracking call found; verify opt-in consent: $(echo "$content" | head -c 120)" "Ensure tracking is opt-in, off by default"
          done < <(grep -rnE "(send_tracking|track_usage|telemetry|analytics.*send|usage_data)" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── CHECK 3: Security - Input/Output ───

          echo -e "\n=== Category 3: Security I/O ===" >&2

          # Raw $_POST/$_GET/$_REQUEST without sanitization
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              trimmed=$(echo "$content" | sed 's/^[ \t]*//')
              [[ "$trimmed" == //* || "$trimmed" == \** ]] && continue
              # Skip if already wrapped in sanitize/wp_unslash
              echo "$content" | grep -qE "(sanitize_|wp_unslash|absint|intval|esc_)" && continue
              # Existence checks (isset/empty) and strict comparisons only read the value.
              remaining=$(echo "$content" | sed -E \
                  -e 's/(isset|empty)\s*\(\s*\$_(POST|GET|REQUEST|SERVER)\[[^]]*\]\s*\)//g' \
                  -e 's/\$_(POST|GET|REQUEST|SERVER)\[[^]]*\]\s*[!=]==//g' \
                  -e 's/[!=]==\s*\$_(POST|GET|REQUEST|SERVER)\[[^]]*\]//g')
              echo "$remaining" | grep -qE '\$_(POST|GET|REQUEST|SERVER)\[' || continue
              add_finding "BLOCKER" "Security-Input" "$file" "$line" "Unsanitized superglobal access: $(echo "$content" | head -c 100)" "Use sanitize_text_field(wp_unslash(\$_POST['key']))"
          done < <(grep -rnIE '\$_(POST|GET|REQUEST|SERVER)\[' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # Missing nonce verification on AJAX handlers
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              # Extract function name from add_action
              func_name=$(echo "$content" | grep -oP "(?:array\s*\(\s*\\\$this\s*,\s*['\"])([^'\"]+)" | head -1 || echo "")
              if [ -n "$func_name" ]; then
                  # Check if function has nonce verification
                  has_nonce=$(grep -c "check_ajax_referer\|wp_verify_nonce\|verify_nonce" "$file" 2>/dev/null || true)
                  if [ "${has_nonce:-0}" -eq 0 ]; then
                      add_finding "BLOCKER" "Security-Nonce" "$file" "$line" "AJAX handler without nonce verification: $(echo "$content" | head -c 100)" "Add check_ajax_referer('action_name', 'nonce')"
                  fi
              fi
          done < <(grep -rnE "add_action\s*\(\s*['\"]wp_ajax_(nopriv_)?" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # REST routes without permission_callback
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              # Look at the whole call (up to the next register_rest_route or 40 lines).
              call=$(awk -v s="$line" 'NR > s + 40 { exit } NR > s && /register_rest_route[[:space:]]*\(/ { exit } NR >= s { print }' "$file" 2>/dev/null || true)
              has_perm=$(echo "$call" | grep -c "permission_callback" || true)
              # Route args passed in a variable (e.g. a route table looped over): accept when
              # the same file defines permission_callback for those args.
              if [ "${has_perm:-0}" -eq 0 ] && ! echo "$call" | grep -qE "['\"]callback['\"]"; then
                  has_perm=$(grep -c "permission_callback" "$file" 2>/dev/null || true)
              fi
              if [ "${has_perm:-0}" -eq 0 ]; then
                  add_finding "BLOCKER" "Security-REST" "$file" "$line" "REST route without permission_callback: $(echo "$content" | head -c 100)" "Add 'permission_callback' => function() { return current_user_can('manage_options'); }"
              fi
          done < <(grep -rnIE '(^|[^A-Za-z0-9_$>:])register_rest_route[[:space:]]*\(' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # Unescaped output
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              trimmed=$(echo "$content" | sed 's/^[ \t]*//')
              [[ "$trimmed" == //* || "$trimmed" == \** ]] && continue
              # Skip if already escaped
              echo "$content" | grep -qE "(esc_html|esc_attr|esc_url|esc_js|wp_kses|sanitize_)" && continue
              add_finding "WARNING" "Security-Escaping" "$file" "$line" "Possible unescaped output: $(echo "$content" | head -c 100)" "Use esc_html(), esc_attr(), esc_url(), or wp_kses()"
          done < <(grep -rnE '^\s*echo\s+\$' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # Direct SQL without prepare
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              # The statement may continue on the next lines.
              statement=$(awk -v s="$line" 'NR >= s && NR <= s + 6 { print; if (/;/) exit } NR > s + 6 { exit }' "$file" 2>/dev/null || true)
              echo "$statement" | grep -qE -- "->prepare\s*\(" && continue
              # Query passed in a variable that was built with prepare() just above.
              query_var=$(echo "$content" | grep -oE -- '->(query|get_results|get_row|get_var|get_col)\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]*' | grep -oE '\$[A-Za-z_][A-Za-z0-9_]*$' | head -1 || true)
              if [ -n "$query_var" ] && sed -n "$(( line > 40 ? line - 40 : 1 )),${line}p" "$file" 2>/dev/null | grep -qF "${query_var} = \$wpdb->prepare("; then
                  continue
              fi
              if [ -n "$query_var" ] && sed -n "$(( line > 40 ? line - 40 : 1 )),${line}p" "$file" 2>/dev/null | grep -qF "${query_var} = \$this->wpdb->prepare("; then
                  continue
              fi
              # Fully static SQL: the only interpolation is the table prefix.
              dynamic=$(echo "$statement" | sed -E -e 's/^.*->(query|get_results|get_row|get_var|get_col)\s*\(//' -e 's/\{?\$(this->)?wpdb->[A-Za-z_]+\}?//g')
              echo "$dynamic" | grep -qE '\$[A-Za-z_]' || continue
              add_finding "BLOCKER" "Security-SQL" "$file" "$line" "Direct DB query possibly without \$wpdb->prepare(): $(echo "$content" | head -c 100)" "Use \$wpdb->prepare() for all queries with variables"
          done < <(grep -rnE '\$wpdb->(query|get_results|get_row|get_var|get_col)\s*\(' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ | grep '\$' || true)

          # register_setting without sanitize_callback
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              has_sanitize=$(sed -n "$((line)),$((line+5))p" "$file" 2>/dev/null | grep -c "sanitize_callback" || true)
              if [ "${has_sanitize:-0}" -eq 0 ]; then
                  add_finding "BLOCKER" "Security-Settings" "$file" "$line" "register_setting() without sanitize_callback: $(echo "$content" | head -c 100)" "Add 'sanitize_callback' in third argument array"
              fi
          done < <(grep -rn "register_setting" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── CHECK 4: ABSPATH Guard ───

          echo -e "\n=== Category 4: ABSPATH Guard ===" >&2

          while IFS= read -r file; do
              skip_path "$file" && continue
              has_guard=$(head -20 "$file" | grep -cE "defined\s*\(\s*['\"]ABSPATH['\"]" || true)
              if [ "${has_guard:-0}" -eq 0 ]; then
                  # Code lines, ignoring the open/close tags, comments and blank lines.
                  first_code=$(awk '{ gsub(/<\?php|\?>/, "") } /^[[:space:]]*(\/\/|#|\/?\*)/ || /^[[:space:]]*$/ { next } { print; exit }' "$file" 2>/dev/null || true)
                  # Empty / "Silence is golden" files and data files (<?php return [...]) are safe.
                  [ -z "$first_code" ] && continue
                  echo "$first_code" | grep -qE '^\s*return[[:space:](\[]' && continue
                  basename_file=$(basename "$file")
                  if [ "$basename_file" = "uninstall.php" ]; then
                      has_uninstall_guard=$(head -20 "$file" | grep -cE "defined\s*\(\s*['\"]WP_UNINSTALL_PLUGIN['\"]" || true)
                      if [ "${has_uninstall_guard:-0}" -eq 0 ]; then
                          add_finding "BLOCKER" "Direct-Access" "$file" "1" "uninstall.php missing WP_UNINSTALL_PLUGIN guard" "Add: if ( ! defined( 'WP_UNINSTALL_PLUGIN' ) ) exit;"
                      fi
                  else
                      add_finding "BLOCKER" "Direct-Access" "$file" "1" "PHP file missing ABSPATH guard" "Add: if ( ! defined( 'ABSPATH' ) ) exit;"
                  fi
              fi
          done < <(find "$PLUGIN_DIR" -name "*.php" -not -path "*/vendor/*" -not -path "*/node_modules/*" 2>/dev/null || true)


          # ─── CHECK 5: Plugin Updater ───

          echo -e "\n=== Category 5: Plugin Updater ===" >&2

          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "BLOCKER" "Plugin-Updater" "$file" "$line" "Custom plugin updater detected (forbidden by G8): $(echo "$content" | head -c 100)" "Remove custom updater; use WP.org update system only"
          done < <(grep -rnE "(plugin-update-checker|WP_GitHub_Updater|WPGitHubUpdater|PucFactory|YahnisElsts|pre_set_site_transient_update_plugins|site_transient_update_plugins)" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── CHECK 6: Forbidden Files ───

          echo -e "\n=== Category 6: Forbidden Files ===" >&2

          # Compressed files
          while IFS= read -r file; do
              skip_path "$file" && continue
              add_finding "BLOCKER" "Forbidden-File" "$file" "0" "Compressed/archive file in plugin (remove before submission)" "Delete file; use composer/npm for dependencies"
          done < <(find "$PLUGIN_DIR" -type f \( -name "*.zip" -o -name "*.gz" -o -name "*.tgz" -o -name "*.rar" -o -name "*.tar" -o -name "*.7z" -o -name "*.phar" \) -not -path "*/node_modules/*" 2>/dev/null || true)

          # Executable files
          while IFS= read -r file; do
              skip_path "$file" && continue
              add_finding "BLOCKER" "Forbidden-File" "$file" "0" "Executable/binary file in plugin" "Remove file"
          done < <(find "$PLUGIN_DIR" -type f \( -name "*.exe" -o -name "*.sh" -o -name "*.bin" -o -name "*.so" -o -name "*.dll" \) -not -path "*/node_modules/*" -not -path "*/.github/*" 2>/dev/null || true)

          # AI/VCS directories
          while IFS= read -r dir; do
              skip_path "$dir/" && continue
              add_finding "WARNING" "Forbidden-Dir" "$dir" "0" "AI/IDE config directory should not ship to WP.org" "Add to .distignore"
          done < <(find "$PLUGIN_DIR" -maxdepth 2 -type d \( -name ".cursor" -o -name ".claude" -o -name ".aider" -o -name ".continue" -o -name ".windsurf" -o -name ".ai" -o -name ".vscode" -o -name ".idea" \) 2>/dev/null || true)

          # Files with spaces in name
          while IFS= read -r file; do
              skip_path "$file" && continue
              basename_file=$(basename "$file")
              if echo "$basename_file" | grep -q " "; then
                  add_finding "BLOCKER" "Forbidden-File" "$file" "0" "Filename contains spaces: $basename_file" "Rename file; remove spaces"
              fi
          done < <(find "$PLUGIN_DIR" -type f -name "* *" -not -path "*/node_modules/*" -not -path "*/vendor/*" 2>/dev/null || true)


          # ─── CHECK 7: Readme Validation ───

          echo -e "\n=== Category 7: Readme ===" >&2

          if [ -f "$PLUGIN_DIR/readme.txt" ]; then
              # Stable tag = trunk
              if grep -qi "Stable tag:\s*trunk" "$PLUGIN_DIR/readme.txt"; then
                  add_finding "BLOCKER" "Readme" "readme.txt" "0" "Stable tag set to 'trunk' (must be specific version)" "Set Stable tag to match plugin Version header"
              fi

              # More than 5 tags
              TAG_COUNT=$(grep -i "^Tags:" "$PLUGIN_DIR/readme.txt" | head -1 | tr ',' '\n' | wc -l || echo "0")
              if [ "$TAG_COUNT" -gt 5 ]; then
                  add_finding "WARNING" "Readme" "readme.txt" "0" "Too many tags ($TAG_COUNT); maximum 5 allowed" "Reduce to 5 most relevant tags"
              fi

              # Missing tested up to
              if ! grep -qi "Tested up to:" "$PLUGIN_DIR/readme.txt"; then
                  add_finding "WARNING" "Readme" "readme.txt" "0" "Missing 'Tested up to' field" "Add: Tested up to: 6.7"
              fi

              # Update URI in plugin header (forbidden)
              MAIN_FILE=$(grep -rl "Plugin Name:" "$PLUGIN_DIR" --include="*.php" | head -1 || echo "")
              if [ -n "$MAIN_FILE" ] && grep -qi "Update URI:" "$MAIN_FILE"; then
                  add_finding "BLOCKER" "Plugin-Header" "$MAIN_FILE" "0" "Update URI header detected (instant rejection)" "Remove Update URI from plugin header"
              fi
          else
              add_finding "BLOCKER" "Readme" "readme.txt" "0" "No readme.txt found" "Create readme.txt per WP.org format"
          fi


          # ─── CHECK 8: ALLOW_UNFILTERED_UPLOADS ───

          echo -e "\n=== Category 8: Dangerous Constants ===" >&2

          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "BLOCKER" "Dangerous-Constant" "$file" "$line" "ALLOW_UNFILTERED_UPLOADS defined (instant rejection)" "Remove; never define this constant"
          done < <(grep -rn "ALLOW_UNFILTERED_UPLOADS" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

          # Defining WP core constants
          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "WARNING" "Dangerous-Constant" "$file" "$line" "Plugin defines WP core constant: $(echo "$content" | head -c 100)" "Remove; do not redefine WP core constants"
          done < <(grep -rnIE "define\s*\(\s*['\"]WP_(DEBUG|DEBUG_LOG|DEBUG_DISPLAY|MEMORY_LIMIT|MAX_MEMORY_LIMIT|CONTENT_DIR|CONTENT_URL|PLUGIN_DIR|PLUGIN_URL|LANG_DIR|HOME|SITEURL|CACHE|POST_REVISIONS|AUTO_UPDATE_CORE|ALLOW_REPAIR|ALLOW_MULTISITE|DEFAULT_THEME|TEMP_DIR|ENVIRONMENT_TYPE|CRON_LOCK_TIMEOUT|DISABLE_FATAL_ERROR_HANDLER|HTTP_BLOCK_EXTERNAL|ACCESSIBLE_HOSTS)['\"]" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── CHECK 9: Localhost References ───

          echo -e "\n=== Category 9: Localhost ===" >&2

          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "WARNING" "Localhost" "$file" "$line" "Localhost/dev reference found: $(echo "$content" | head -c 80)" "Remove before production release"
          done < <(grep -rnIE "(localhost|127\.0\.0\.1)" "$PLUGIN_DIR" --include="*.php" --include="*.js" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ | grep -v "*.min.js" || true)


          # ─── CHECK 10: Code Obfuscation ───

          echo -e "\n=== Category 10: Code Obfuscation ===" >&2

          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "BLOCKER" "Obfuscation" "$file" "$line" "Obfuscated/encoded code detected: $(echo "$content" | head -c 80)" "Ship readable source code"
          done < <(grep -rnE '(@Zend;|sourceguardian\.com|sg_load|ionCube|\$__x=|eval\s*\(\s*base64_decode|eval\s*\(\s*gzinflate)' "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── CHECK 11: Appsero SDK (WPPOOL-specific) ───

          echo -e "\n=== Category 11: Appsero SDK ===" >&2

          APPSERO_FILE=$(find "$PLUGIN_DIR" -path "*/appsero/src/Client.php" -not -path "*/node_modules/*" 2>/dev/null | head -1 || echo "")
          if [ -n "$APPSERO_FILE" ]; then
              # Check for updater method usage
              while IFS=: read -r file line content; do
                  skip_path "$file" && continue
                  add_finding "BLOCKER" "Appsero-Updater" "$file" "$line" "Appsero updater() call in free plugin (forbidden by G8)" "Remove ->updater() call; free plugins use WP.org updates"
              done < <(grep -rn "->updater()" "$PLUGIN_DIR" --include="*.php" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)

              # Check if Appsero is disclosed in readme
              if [ -f "$PLUGIN_DIR/readme.txt" ]; then
                  has_appsero_disclosure=$(grep -ci "appsero" "$PLUGIN_DIR/readme.txt" || true)
                  if [ "${has_appsero_disclosure:-0}" -eq 0 ]; then
                      add_finding "BLOCKER" "Appsero-Disclosure" "readme.txt" "0" "Appsero SDK bundled but not disclosed in readme External services section" "Add Appsero to == External services == with api.appsero.com URL"
                  fi
              fi
          fi


          # ─── CHECK 12: Headway Changelog Widget ───

          echo -e "\n=== Category 12: Headway Widget ===" >&2

          while IFS=: read -r file line content; do
              skip_path "$file" && continue
              add_finding "WARNING" "Headway-Widget" "$file" "$line" "Headway changelog widget loads external CDN; needs disclosure" "Add to readme == External services == OR make opt-in"
          done < <(grep -rnE "(headway|headwayapp\.co|HW_widget)" "$PLUGIN_DIR" --include="*.php" --include="*.js" 2>/dev/null | grep -v vendor/ | grep -v node_modules/ || true)


          # ─── REPORT SUMMARY ───

          echo -e "\n========================================" >&2
          echo -e "=== COMPLIANCE CHECK COMPLETE ===" >&2
          echo -e "========================================" >&2
          echo -e "${RED}BLOCKERS: $BLOCKERS${NC}" >&2
          echo -e "${YELLOW}WARNINGS: $WARNINGS${NC}" >&2
          echo -e "${GREEN}INFO: $INFO_COUNT${NC}" >&2
          echo -e "========================================" >&2

          if [ "$BLOCKERS" -gt 0 ]; then
              echo -e "\n${RED}RESULT: FAIL — $BLOCKERS blocker(s) found. PR should not be merged.${NC}" >&2
              EXIT_CODE=1
          elif [ "$WARNINGS" -gt 0 ]; then
              echo -e "\n${YELLOW}RESULT: WARN — No blockers, but $WARNINGS warning(s) found. Review recommended.${NC}" >&2
              EXIT_CODE=0
          else
              echo -e "\n${GREEN}RESULT: PASS — No issues found.${NC}" >&2
              EXIT_CODE=0
          fi

          # Output JSON array to stdout
          echo "["
          first=true
          while IFS= read -r line; do
              if [ "$first" = true ]; then
                  first=false
              else
                  echo ","
              fi
              echo "  $line"
          done < "$FINDINGS_FILE"
          echo "]"

          rm -f "$FINDINGS_FILE"
          exit $EXIT_CODE
          WPPOOL_CHECKER_EOF
          # <<< embedded check-wporg-compliance.sh

      - name: Run WP.org compliance checks
        id: check
        run: |
          CHECKER="$RUNNER_TEMP/check-wporg-compliance.sh"
          chmod +x "$CHECKER"

          # Run checker, capture JSON output and exit code
          set +e
          FINDINGS=$("$CHECKER" "${{ inputs.plugin-dir }}" 2>compliance-stderr.txt)
          CHECK_EXIT=$?
          set -e

          # Show stderr (human-readable output)
          cat compliance-stderr.txt

          # Save JSON findings
          echo "$FINDINGS" > compliance-findings.json

          # Count findings
          BLOCKERS=$(echo "$FINDINGS" | grep -c '"severity":"BLOCKER"' || true)
          WARNINGS=$(echo "$FINDINGS" | grep -c '"severity":"WARNING"' || true)

          echo "blockers=$BLOCKERS" >> "$GITHUB_OUTPUT"
          echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"

          if [ "$CHECK_EXIT" -ne 0 ]; then
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          elif [ "$WARNINGS" -gt 0 ] && [ "${{ inputs.fail-on-warnings }}" = "true" ]; then
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          else
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          fi

      - name: Write compliance report to run summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          try:
              findings = json.load(open('compliance-findings.json', encoding='utf-8'))
          except Exception:
              findings = None

          print('## WP.org Compliance Report')
          print()
          if findings is None:
              print('The compliance checker did not produce a report. Open the "Run WP.org compliance checks" step log for details.')
              raise SystemExit

          def cell(value, limit):
              return str(value).replace('|', '\\|').replace('\n', ' ')[:limit]

          blockers = [f for f in findings if f.get('severity') == 'BLOCKER']
          warnings = [f for f in findings if f.get('severity') == 'WARNING']
          status = 'FAIL: fix the blockers below before merging' if blockers else 'PASS: no WP.org blockers found'
          print(f'**Result: {status}**')
          print()
          print('| Blockers | Warnings |')
          print('|---|---|')
          print(f'| {len(blockers)} | {len(warnings)} |')
          for title, rows in (('Blockers (would get the plugin closed on WP.org)', blockers), ('Warnings (review recommended)', warnings)):
              if not rows:
                  continue
              print()
              print(f'### {title}')
              print()
              print('| Category | File | Issue | How to fix |')
              print('|---|---|---|---|')
              for f in rows[:200]:
                  where = f"{f.get('file', '')}:{f.get('line', 0)}" if f.get('line') else f.get('file', '')
                  print(f"| {cell(f.get('category', ''), 40)} | `{cell(where, 120)}` | {cell(f.get('message', ''), 200)} | {cell(f.get('fix', ''), 150)} |")
              if len(rows) > 200:
                  print()
                  print(f'_{len(rows) - 200} more in the compliance-report artifact._')
          PY

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: |
            compliance-findings.json
            compliance-stderr.txt

  # ─── Job: AI review of the changed code ───
  ai-review:
    name: AI Review
    runs-on: ubuntu-latest
    if: ${{ inputs.ai-review }}
    outputs:
      status: ${{ steps.ai.outputs.ai_status }}
      blockers: ${{ steps.ai.outputs.ai_blockers }}
      warnings: ${{ steps.ai.outputs.ai_warnings }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Embedded like the checker above; this step must not contain any ${{ }} expression.
      - name: Write AI reviewer
        run: |
          # >>> embedded ai-review.py (generated by action/embed-checker.py, do not edit)
          cat > "$RUNNER_TEMP/ai-review.py" <<'WPPOOL_AI_REVIEW_EOF'
          #!/usr/bin/env python3
          """AI review of the plugin code changed by a commit or pull request.

          Sends the diff (plus the full changed files for context) and the WPPOOL review rules to
          Claude (if ANTHROPIC_API_KEY is set) or Gemini (if GEMINI_API_KEY is set) and writes:

            ai-findings.json   structured findings
            ai-report.md       Markdown report (run summary + PR comment)
            $GITHUB_OUTPUT     ai_status, ai_blockers, ai_warnings, ai_provider

          An API failure is reported as ai_status=error and never fails the job by itself, so a
          provider outage cannot block merges. Real findings are judged by the Compliance Gate.
          """

          import fnmatch
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          PLUGIN_DIR = os.environ.get('PLUGIN_DIR', '.') or '.'
          RULES_FILE = os.environ.get('RULES_FILE', 'ai-review-rules.md')
          EVENT = os.environ.get('EVENT_NAME', '')
          BEFORE = os.environ.get('BEFORE_SHA', '')
          HEAD = os.environ.get('HEAD_SHA', '') or 'HEAD'
          BASE_REF = os.environ.get('BASE_REF', '')
          REF_NAME = os.environ.get('REF_NAME', '')
          DEFAULT_BRANCH = os.environ.get('DEFAULT_BRANCH', '')
          TEXT_DOMAIN = os.environ.get('TEXT_DOMAIN', '')
          GEMINI_KEY = os.environ.get('GEMINI_API_KEY', '')
          ANTHROPIC_KEY = os.environ.get('ANTHROPIC_API_KEY', '')
          GEMINI_MODEL = os.environ.get('GEMINI_MODEL', '') or 'gemini-flash-lite-latest'
          CLAUDE_MODEL = os.environ.get('CLAUDE_MODEL', '') or 'claude-opus-5-5'

          CODE_EXTENSIONS = ('.php', '.js', '.jsx', '.ts', '.tsx', '.mjs', '.vue')
          ALWAYS_SKIP = ('vendor/', 'node_modules/', '.git/', '.github/', 'build/', 'dist/')
          MAX_FILE_CHARS = 60000
          MAX_TOTAL_CHARS = 350000

          FINDINGS_SCHEMA = {
              'type': 'object',
              'properties': {
                  'summary': {'type': 'string'},
                  'findings': {
                      'type': 'array',
                      'items': {
                          'type': 'object',
                          'properties': {
                              'severity': {'type': 'string', 'enum': ['BLOCKER', 'WARNING']},
                              'category': {'type': 'string'},
                              'file': {'type': 'string'},
                              'line': {'type': 'integer'},
                              'message': {'type': 'string'},
                              'fix': {'type': 'string'},
                          },
                          'required': ['severity', 'category', 'file', 'line', 'message', 'fix'],
                          'additionalProperties': False,
                      },
                  },
              },
              'required': ['summary', 'findings'],
              'additionalProperties': False,
          }


          def git(*args):
              return subprocess.run(['git', *args], capture_output=True, text=True, errors='replace').stdout


          def git_ok(*args):
              return subprocess.run(['git', *args], capture_output=True, text=True).returncode == 0


          def set_output(**values):
              path = os.environ.get('GITHUB_OUTPUT')
              if not path:
                  return
              with open(path, 'a', encoding='utf-8') as fh:
                  for key, value in values.items():
                      fh.write(f'{key}={value}\n')


          def distignore_patterns():
              path = os.path.join(PLUGIN_DIR, '.distignore')
              if not os.path.isfile(path):
                  return []
              patterns = []
              for raw in open(path, encoding='utf-8', errors='replace'):
                  line = raw.strip()
                  if line and not line.startswith('#'):
                      patterns.append(line)
              return patterns


          def is_reviewable(rel, patterns):
              if not (rel.endswith(CODE_EXTENSIONS) or os.path.basename(rel) == 'readme.txt'):
                  return False
              if rel.endswith(('.min.js', '.min.css', '.asset.php', '.l10n.php')):
                  return False
              if any(('/' + rel).find('/' + skip) != -1 for skip in ALWAYS_SKIP):
                  return False
              for pattern in patterns:
                  glob = pattern.strip('/').replace('**', '*')
                  anchored = pattern.startswith('/')
                  candidates = [rel] if anchored else [rel] + ['/'.join(rel.split('/')[i:]) for i in range(1, rel.count('/') + 1)]
                  for cand in candidates:
                      if fnmatch.fnmatch(cand, glob) or fnmatch.fnmatch(cand, glob + '/*'):
                          return False
              return True


          def diff_range():
              """Return (base, head, description) for the change to review."""
              zero = '0' * 40
              if EVENT == 'pull_request' and BASE_REF:
                  git('fetch', '--no-tags', '--depth=200', 'origin', BASE_REF)
                  base = git('merge-base', f'origin/{BASE_REF}', HEAD).strip()
                  if base:
                      return base, HEAD, f'pull request against {BASE_REF}'
              if EVENT == 'push' and DEFAULT_BRANCH and REF_NAME and REF_NAME != DEFAULT_BRANCH:
                  # Feature branch: review everything the branch changes, like a pull request would.
                  git('fetch', '--no-tags', '--depth=200', 'origin', DEFAULT_BRANCH)
                  base = git('merge-base', f'origin/{DEFAULT_BRANCH}', HEAD).strip()
                  if base:
                      return base, HEAD, f'branch {REF_NAME} compared to {DEFAULT_BRANCH}'
              if EVENT == 'push' and BEFORE and BEFORE != zero and git_ok('cat-file', '-e', f'{BEFORE}^{{commit}}'):
                  return BEFORE, HEAD, 'commits in this push'
              if git_ok('rev-parse', '--verify', f'{HEAD}~1'):
                  return f'{HEAD}~1', HEAD, 'latest commit'
              return None, HEAD, 'first commit'


          def collect_changes():
              base, head, label = diff_range()
              patterns = distignore_patterns()
              prefix = os.path.normpath(PLUGIN_DIR).replace('\\', '/')
              prefix = '' if prefix in ('.', '') else prefix.rstrip('/') + '/'

              if base:
                  names = git('diff', '--name-only', '--diff-filter=AMR', base, head).splitlines()
              else:
                  names = git('ls-tree', '-r', '--name-only', head).splitlines()

              files = []
              for name in names:
                  if prefix and not name.startswith(prefix):
                      continue
                  rel = name[len(prefix):]
                  if is_reviewable(rel, patterns) and os.path.isfile(name):
                      files.append(name)

              parts, total, truncated = [], 0, []
              for name in files:
                  diff = git('diff', '--unified=8', base, head, '--', name) if base else ''
                  try:
                      content = open(name, encoding='utf-8', errors='replace').read()
                  except OSError:
                      content = ''
                  numbered = '\n'.join(f'{i + 1:5d}| {line}' for i, line in enumerate(content.splitlines()))
                  if len(numbered) > MAX_FILE_CHARS:
                      numbered = numbered[:MAX_FILE_CHARS] + '\n... (file truncated for length)'
                  block = f'### FILE: {name}\n\n#### Diff\n```diff\n{diff or "(new file / no diff available)"}\n```\n\n#### Full file (new version, with line numbers)\n```\n{numbered}\n```\n'
                  if total + len(block) > MAX_TOTAL_CHARS:
                      truncated.append(name)
                      continue
                  parts.append(block)
                  total += len(block)
              return files, parts, truncated, label


          def build_prompt(parts, truncated, label):
              lines = [
                  f'Review the following WordPress plugin changes ({label}).',
                  f'Plugin text domain / slug: {TEXT_DOMAIN or "(not provided)"}.',
                  'Return JSON matching this shape: {"summary": string, "findings": [{"severity": "BLOCKER"|"WARNING", '
                  '"category": string, "file": string, "line": integer, "message": string, "fix": string}]}.',
                  'Use the exact file paths shown after "FILE:". Report only real problems in the changed code.',
                  '',
              ]
              if truncated:
                  lines.append('These changed files were too large to include and were not reviewed: ' + ', '.join(truncated))
                  lines.append('')
              return '\n'.join(lines) + '\n'.join(parts)


          def http_json(url, payload, headers, timeout=300):
              data = json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json', **headers})
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return json.loads(resp.read().decode('utf-8'))


          def pick_gemini_model(lite=False):
              """Newest available Flash model (or Flash-Lite) for when the configured one is missing or out of quota."""
              req = urllib.request.Request('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',
                                           headers={'x-goog-api-key': GEMINI_KEY})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  models = json.loads(resp.read().decode('utf-8')).get('models', [])
              usable = [m['name'].split('/', 1)[-1] for m in models
                        if 'generateContent' in m.get('supportedGenerationMethods', [])
                        and 'flash' in m['name'] and (('lite' in m['name']) == lite)
                        and not any(x in m['name'] for x in ('tts', 'image', 'live', 'embedding', 'audio', 'exp', 'preview'))]
              return sorted(usable)[-1] if usable else None


          def review_with_gemini(rules, prompt):
              model = GEMINI_MODEL
              tried_lite = False
              payload = {
                  'systemInstruction': {'parts': [{'text': rules}]},
                  'contents': [{'role': 'user', 'parts': [{'text': prompt}]}],
                  'generationConfig': {'temperature': 0.1, 'responseMimeType': 'application/json'},
              }
              for attempt in range(5):
                  url = f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent'
                  try:
                      data = http_json(url, payload, {'x-goog-api-key': GEMINI_KEY})
                      text = ''.join(p.get('text', '') for p in data['candidates'][0]['content']['parts'])
                      return json.loads(text), f'gemini ({model})'
                  except urllib.error.HTTPError as err:
                      body = err.read().decode('utf-8', 'replace')
                      print(f'Gemini API error {err.code} for {model}:')
                      print(body)
                      if err.code == 404 and attempt == 0:
                          fallback = pick_gemini_model()
                          if fallback and fallback != model:
                              print(f'Gemini model {model} not available; using {fallback}.')
                              model = fallback
                              continue
                      if err.code == 429 and 'quota' in body.lower() and not tried_lite:
                          # Out of quota for this model (often: free tier has none): try Flash-Lite once.
                          tried_lite = True
                          lite = pick_gemini_model(lite=True)
                          if lite and lite != model:
                              print(f'Out of quota for {model}; trying {lite}.')
                              model = lite
                              continue
                      if err.code in (429, 500, 503) and attempt < 3:
                          time.sleep(15 * (attempt + 1))
                          continue
                      first = json.loads(body).get('error', {}).get('message', body) if body.startswith('{') else body
                      raise RuntimeError(f'Gemini API error {err.code}: {first[:400]}')
              raise RuntimeError('Gemini API kept failing')


          def review_with_claude(rules, prompt):
              import anthropic

              client = anthropic.Anthropic(api_key=ANTHROPIC_KEY, max_retries=3)
              response = client.beta.messages.create(
                  model=CLAUDE_MODEL,
                  max_tokens=16000,
                  betas=['server-side-fallback-2026-07-01'],
                  fallbacks='default',
                  system=rules,
                  output_config={'effort': 'high', 'format': {'type': 'json_schema', 'schema': FINDINGS_SCHEMA}},
                  messages=[{'role': 'user', 'content': prompt}],
              )
              if response.stop_reason == 'refusal':
                  raise RuntimeError('Claude declined to review this change (refusal).')
              text = next(block.text for block in response.content if block.type == 'text')
              return json.loads(text), f'claude ({response.model})'


          def clean(findings, files):
              out = []
              for f in findings if isinstance(findings, list) else []:
                  if not isinstance(f, dict):
                      continue
                  severity = str(f.get('severity', 'WARNING')).upper()
                  try:
                      line = int(f.get('line') or 0)
                  except (TypeError, ValueError):
                      line = 0
                  out.append({
                      'severity': 'BLOCKER' if severity == 'BLOCKER' else 'WARNING',
                      'category': str(f.get('category', 'AI review'))[:60],
                      'file': str(f.get('file', '')),
                      'line': line,
                      'message': str(f.get('message', '')).strip(),
                      'fix': str(f.get('fix', '')).strip(),
                  })
              order = {'BLOCKER': 0, 'WARNING': 1}
              return sorted(out, key=lambda x: (order[x['severity']], x['file'], x['line']))


          def cell(value, limit):
              return str(value).replace('|', '\\|').replace('\n', ' ')[:limit]


          def write_report(status, provider, summary, findings, files, truncated, label, note=''):
              blockers = [f for f in findings if f['severity'] == 'BLOCKER']
              warnings = [f for f in findings if f['severity'] == 'WARNING']
              md = ['## AI Review (WP.org rules + security)', '']
              if status == 'skipped':
                  md.append(note or 'Skipped.')
              elif status == 'error':
                  md.append(f':warning: The AI review could not run: {cell(note, 400)}')
                  md.append('')
                  md.append('This does not block the merge; the pattern-based checks above still apply.')
              elif not files:
                  md.append(summary or 'No reviewable plugin code changed.')
              else:
                  result = 'FAIL: fix the AI-reported blockers before merging' if blockers else 'PASS: no blockers found by the AI review'
                  md += [f'**Result: {result}**', '', f'Reviewed {len(files)} changed file(s) in the {label} with {provider}.', '']
                  if summary:
                      md += [cell(summary, 1500), '']
                  md += ['| Blockers | Warnings |', '|---|---|', f'| {len(blockers)} | {len(warnings)} |']
                  for title, rows in (('Blockers', blockers), ('Warnings', warnings)):
                      if rows:
                          md += ['', f'### {title}', '', '| Category | File | Issue | How to fix |', '|---|---|---|---|']
                          for f in rows[:100]:
                              where = f"{f['file']}:{f['line']}" if f['line'] else f['file']
                              md.append(f"| {cell(f['category'], 40)} | `{cell(where, 120)}` | {cell(f['message'], 400)} | {cell(f['fix'], 300)} |")
                  if truncated:
                      md += ['', 'Not reviewed (too large): ' + ', '.join(f'`{t}`' for t in truncated)]
                  md += ['', '_AI findings can be wrong. If a blocker is a false positive, explain it in the PR and ask a maintainer to override._']
              report = '\n'.join(md) + '\n'
              open('ai-report.md', 'w', encoding='utf-8').write(report)
              json.dump({'status': status, 'provider': provider, 'summary': summary, 'findings': findings},
                        open('ai-findings.json', 'w', encoding='utf-8'), indent=2)
              summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_path:
                  open(summary_path, 'a', encoding='utf-8').write(report)
              set_output(ai_status=status, ai_blockers=len(blockers), ai_warnings=len(warnings), ai_provider=provider or 'none')
              print(report)


          def main():
              if not GEMINI_KEY and not ANTHROPIC_KEY:
                  write_report('skipped', '', '', [], [], [], '', 'No AI key configured (add a GEMINI_API_KEY or ANTHROPIC_API_KEY secret to enable the AI review).')
                  return
              files, parts, truncated, label = collect_changes()
              if not files:
                  write_report('ok', 'none', 'No reviewable plugin code changed in this commit.', [], [], [], label)
                  return
              rules = open(RULES_FILE, encoding='utf-8').read()
              prompt = build_prompt(parts, truncated, label)
              try:
                  if ANTHROPIC_KEY:
                      result, provider = review_with_claude(rules, prompt)
                  else:
                      result, provider = review_with_gemini(rules, prompt)
              except Exception as err:  # noqa: BLE001 - any provider failure is reported, not fatal
                  write_report('error', '', '', [], files, truncated, label, str(err))
                  return
              write_report('ok', provider, str(result.get('summary', '')), clean(result.get('findings', []), files), files, truncated, label)


          if __name__ == '__main__':
              sys.exit(main())
          WPPOOL_AI_REVIEW_EOF
          # <<< embedded ai-review.py
          # >>> embedded ai-review-rules.md (generated by action/embed-checker.py, do not edit)
          cat > "$RUNNER_TEMP/ai-review-rules.md" <<'WPPOOL_AI_RULES_EOF'
          You are the WPPOOL WordPress plugin reviewer. You review code changes in a FREE plugin
          that is published on WordPress.org. Your job is to stop changes that would get the plugin
          closed by the WordPress.org plugin review team, or that introduce a security vulnerability.

          WPPOOL had 9 free plugins closed by WordPress.org in August 2026. The rules below come from
          those closure emails, the official WordPress.org plugin guidelines, and WordPress security
          practice. Apply them strictly but precisely.

          ## How to report

          - Review ONLY the changed code (the diff). Use the full file contents for context: how a
            value is sanitized before, whether a nonce is checked earlier in the function, etc.
          - BLOCKER = a clear violation of a rule below that WordPress.org would act on, or an
            exploitable security bug. You must be able to point to the exact line.
          - WARNING = probably wrong or risky but depends on context you cannot see, or a best-practice
            gap that WordPress.org would not close the plugin for.
          - Do not report style or formatting (indentation, alignment, naming style); PHPCS does that.
          - Do not report something as a BLOCKER if the code already handles it (e.g. a value that is
            cast with absint() is not "unsanitized").
          - If nothing is wrong, return an empty findings list. Do not invent problems to look useful.
          - "line" is the line number in the NEW version of the file.
          - Write message and fix in plain English a developer can act on immediately.

          ## 1. Guideline 5: Trialware (cause of every closure)

          The free plugin must be fully functional on its own. Paid features live in the Pro add-on.
          BLOCKER when the free plugin:
          - Checks a license, `is_pro`, `isPro`, `license_status`, `is_premium`, `can_use_premium`, or
            similar before running a feature.
          - Detects Pro with `class_exists( '...Pro...' )`, `defined( '..._PRO_...' )`,
            `function_exists( '..._pro_...' )`, `is_plugin_active( '...-pro/...' )` and then enables,
            disables or changes behaviour based on it.
          - Contains backend code for a paid feature (save handler, AJAX/REST endpoint, cron job,
            render logic, or the JS that performs the feature) that only works when Pro is present.
          - Saves a setting in the free plugin that the free plugin never reads or applies.
          - Uses `apply_filters( 'x', false )` / `null` / `[]` / `''` purely as a lock that Pro flips.
            The default must be free's real working value.
          Allowed (do NOT flag): locked UI in React/Vue (badge, disabled control, upsell popup) when
          the free plugin has no backend for that feature; `apply_filters()` / `do_action()` hooks that
          Pro attaches to; passing a display-only pro flag to JS via `wp_localize_script()`.

          ## 2. Guideline 6: Serviceware and external services

          BLOCKER when the change adds a call to an external service (`wp_remote_*`, `fetch`, `axios`,
          script/style URLs, iframes, tracking pixels, IP lookup, telemetry, changelog widgets, fonts
          from CDNs, SaaS APIs) and readme.txt `== External services ==` does not document that service
          with: what it is for, what data is sent, when it is sent, and links to its terms of service
          and privacy policy.
          BLOCKER: tracking or "phoning home" that runs without explicit opt-in, or that still sends
          anything after the user said No.
          BLOCKER: loading JS or CSS from a remote URL instead of bundling it (Google Fonts excepted).

          ## 3. Security

          BLOCKER:
          - State-changing request handlers (admin-post, AJAX, REST, form submit) without BOTH a nonce
            check (`check_ajax_referer`, `wp_verify_nonce`, `check_admin_referer`) and a capability
            check (`current_user_can`). REST routes need a real `permission_callback`
            (never `__return_true` for anything that writes or reads private data).
          - `wp_ajax_nopriv_*` handlers that do privileged work.
          - Input from `$_GET`, `$_POST`, `$_REQUEST`, `$_COOKIE`, `$_SERVER`, `$_FILES`, REST params or
            JSON bodies used without `wp_unslash()` + a type-appropriate sanitizer, or sanitizing the
            whole `$_POST` array at once. Validate against allow-lists where a fixed set is expected.
          - Output not escaped late (`esc_html`, `esc_attr`, `esc_url`, `esc_js`, `wp_kses*`), including
            shortcode/block return strings and data from external APIs, spreadsheets or CSV.
          - SQL built with variables but not passed through `$wpdb->prepare()`; `LIKE` without
            `$wpdb->esc_like()`; table or column names from user input.
          - Request input used to build option, transient, meta or method names (`$this->{$x}`,
            `update_option( $_POST['name'], ... )`), `call_user_func` on user input, or `unserialize()`
            / `maybe_unserialize()` on user-controlled data (object injection).
          - File operations on user-controlled paths (path traversal), file uploads without type and
            capability checks, `include`/`require` of user-controlled paths.
          - Privilege escalation: letting users change roles/capabilities or other users' data without
            the right capability; exposing secrets, API keys or other users' data in responses or JS.
          - Open redirects (`wp_redirect` with user input; use `wp_safe_redirect`).

          ## 4. WordPress.org technical rules

          BLOCKER:
          - Calling core loading files directly: `require` / `include` of `wp-load.php`,
            `wp-config.php`, `wp-blog-header.php`, `wp-admin/admin.php` and similar.
          - PHP files that run code without a direct-access guard
            (`if ( ! defined( 'ABSPATH' ) ) exit;`). Files that only declare classes/functions or only
            return data are fine.
          - Custom plugin update checkers or hooking `pre_set_site_transient_update_plugins` /
            `plugins_api`; installing or activating other plugins (use the `Requires Plugins:` header).
          - Writing files into the plugin, theme or core directories, or generating PHP files. Use the
            database or `wp_upload_dir()`.
          - Hardcoded `wp-content` / `wp-json` paths or URLs instead of `WP_PLUGIN_DIR`,
            `plugin_dir_path()`, `plugins_url()`, `content_url()`, `rest_url()`.
          - Defining WordPress core constants (`WP_DEBUG`, `WP_MEMORY_LIMIT`, ...), calling `ini_set()`,
            `error_reporting()`, `set_time_limit()` without need, or `date_default_timezone_set()`;
            hooking global filters to change behaviour outside the plugin's own screens.
          - `ob_start()` without a matching `ob_get_clean()` / `ob_end_*()` on every path.
          - HEREDOC or NOWDOC syntax.
          - Bundling a library WordPress core already ships (jQuery, jQuery UI, Backbone, Underscore,
            Moment, React from wp-element, PHPMailer, etc.) instead of using the core copy.
          - Bundled third-party PHP libraries without a unique namespace/prefix or without a
            `class_exists()` guard (conflicts with other plugins); outdated or abandoned libraries.
          - Minified/compiled JS or CSS added without its source being in the repo or documented in
            readme.txt (`== Build Instructions ==` / public source link).
          - Internationalization: text domain other than the plugin slug, variables or constants as the
            text domain, non-literal strings inside `__()` / `_e()` / `esc_html__()` etc., placeholders
            without a `translators:` comment.
          - New functions, classes, options, transients, hooks, script handles or JS globals without the
            plugin's unique prefix (4+ characters).
          - `register_setting()` without a `sanitize_callback`.
          - Admin notices or upsells shown outside the plugin's own pages, or not dismissible; review
            requests filtered to 5-star; "Powered by" links that are not opt-in.

          ## 5. What is NOT a problem (avoid false positives)

          - `isset()` / `empty()` checks and strict comparisons (`===`) on superglobals.
          - Queries that use `$wpdb->prepare()` (even when it is on the next line) or only interpolate
            `$wpdb->prefix` / `$wpdb->posts` style table names.
          - Method names that merely contain words like `is_process_running` or `process`.
          - Code in tests, build tooling, vendor or node_modules.
          - `apply_filters()` defaults that are the free plugin's real working value.
          WPPOOL_AI_RULES_EOF
          # <<< embedded ai-review-rules.md

      - name: Run AI review
        id: ai
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini-model }}
          CLAUDE_MODEL: ${{ inputs.claude-model }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TEXT_DOMAIN: ${{ inputs.plugin-text-domain }}
          PLUGIN_DIR: ${{ inputs.plugin-dir }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python3 -m pip install --quiet anthropic
          fi
          RULES_FILE="$RUNNER_TEMP/ai-review-rules.md" python3 "$RUNNER_TEMP/ai-review.py"

      - name: Upload AI review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-report
          path: |
            ai-report.md
            ai-findings.json
          if-no-files-found: ignore

  # ─── Job 3: Post PR Comment ───
  comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [phpcs, wporg-compliance, ai-review]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Download compliance report
        uses: actions/download-artifact@v4
        with:
          name: compliance-report
          path: reports

      - name: Download PHPCS report
        uses: actions/download-artifact@v4
        with:
          name: phpcs-report
          path: reports
        continue-on-error: true

      - name: Download AI review report
        uses: actions/download-artifact@v4
        with:
          name: ai-review-report
          path: reports
        continue-on-error: true

      - name: Generate and post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let findings = [];
            try {
              const raw = fs.readFileSync('reports/compliance-findings.json', 'utf8');
              findings = JSON.parse(raw);
            } catch (e) {
              console.log('No findings file found');
            }

            let phpcsReport = '';
            try {
              phpcsReport = fs.readFileSync('reports/phpcs-summary.txt', 'utf8');
            } catch (e) {
              console.log('No PHPCS report found');
            }

            const blockers = findings.filter(f => f.severity === 'BLOCKER');
            const warnings = findings.filter(f => f.severity === 'WARNING');
            const infos = findings.filter(f => f.severity === 'INFO');

            const result = '${{ needs.wporg-compliance.outputs.result }}';
            const emoji = result === 'FAIL' ? '🚫' : (warnings.length > 0 ? '⚠️' : '✅');

            let body = `## ${emoji} WP.org Compliance Check\n\n`;
            body += `| Metric | Count |\n|---|---|\n`;
            body += `| Blockers | **${blockers.length}** |\n`;
            body += `| Warnings | ${warnings.length} |\n`;
            body += `| Info | ${infos.length} |\n\n`;

            if (blockers.length > 0) {
              body += `### 🚫 Blockers (will cause WP.org closure)\n\n`;
              body += `| Category | File | Issue | Fix |\n|---|---|---|---|\n`;
              for (const f of blockers) {
                const file = f.line > 0 ? `\`${f.file}:${f.line}\`` : `\`${f.file}\``;
                const msg = f.message.replace(/\|/g, '\\|').substring(0, 200);
                const fix = (f.fix || '').replace(/\|/g, '\\|').substring(0, 150);
                body += `| ${f.category} | ${file} | ${msg} | ${fix} |\n`;
              }
              body += `\n`;
            }

            if (warnings.length > 0) {
              body += `### ⚠️ Warnings (may cause closure)\n\n`;
              body += `| Category | File | Issue | Fix |\n|---|---|---|---|\n`;
              for (const f of warnings) {
                const file = f.line > 0 ? `\`${f.file}:${f.line}\`` : `\`${f.file}\``;
                const msg = f.message.replace(/\|/g, '\\|').substring(0, 200);
                const fix = (f.fix || '').replace(/\|/g, '\\|').substring(0, 150);
                body += `| ${f.category} | ${file} | ${msg} | ${fix} |\n`;
              }
              body += `\n`;
            }

            if (blockers.length === 0 && warnings.length === 0) {
              body += `### ✅ All clear!\n\nNo WP.org compliance issues detected.\n\n`;
            }

            if (phpcsReport) {
              body += `<details>\n<summary>PHPCS Summary</summary>\n\n\`\`\`\n${phpcsReport.substring(0, 3000)}\n\`\`\`\n</details>\n\n`;
            }

            try {
              body += fs.readFileSync('reports/ai-report.md', 'utf8').substring(0, 30000) + `\n`;
            } catch (e) {
              console.log('No AI review report found');
            }

            body += `---\n*Powered by [WPPOOL Plugin Reviewer](https://github.com/WPPOOL/wppool-plugin-reviewer)*`;

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.body && c.body.includes('WP.org Compliance Check') &&
              c.body.includes('WPPOOL Plugin Reviewer')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  # ─── Job 4: Set Check Status ───
  status:
    name: Compliance Gate
    runs-on: ubuntu-latest
    needs: [wporg-compliance, ai-review]
    if: always()
    steps:
      - name: Check result
        run: |
          AI_JOB="${{ needs.ai-review.result }}"
          AI_STATUS="${{ needs.ai-review.outputs.status }}"
          AI_BLOCKERS="${{ needs.ai-review.outputs.blockers }}"
          FAIL_ON_AI="${{ inputs.fail-on-ai-blockers }}"

          RESULT="${{ needs.wporg-compliance.outputs.result }}"
          BLOCKERS="${{ needs.wporg-compliance.outputs.blockers }}"
          WARNINGS="${{ needs.wporg-compliance.outputs.warnings }}"

          JOB_RESULT="${{ needs.wporg-compliance.result }}"

          echo "Compliance job: $JOB_RESULT"
          echo "Result: $RESULT"
          echo "Blockers: $BLOCKERS"
          echo "Warnings: $WARNINGS"

          # A checker that crashed or never ran must not pass the gate.
          if [ "$JOB_RESULT" != "success" ] || [ -z "$RESULT" ]; then
            echo "::error::WP.org compliance check did not complete (job result: $JOB_RESULT). See the 'WP.org Compliance' job log."
            exit 1
          fi

          if [ "$RESULT" = "FAIL" ]; then
            echo "::error::WP.org compliance check failed with $BLOCKERS blocker(s). PR cannot be merged."
            exit 1
          fi

          echo "AI review job: $AI_JOB (status: ${AI_STATUS:-n/a}, blockers: ${AI_BLOCKERS:-0})"
          # A provider outage or missing key must not block merges; real findings do.
          if [ "$AI_JOB" = "failure" ] || [ "$AI_STATUS" = "error" ]; then
            echo "::warning::The AI review did not complete. See the 'AI Review' job log."
          fi
          if [ "$FAIL_ON_AI" = "true" ] && [ "${AI_BLOCKERS:-0}" -gt 0 ]; then
            echo "::error::The AI review found $AI_BLOCKERS blocker(s). See the AI Review section of the run summary."
            exit 1
          fi
