# ─────────────────────────────────────────────────────────────
# WP.org Compliance PR Check
# Copy this file to your plugin repo: .github/workflows/wporg-compliance.yml
# ─────────────────────────────────────────────────────────────
#
# What it does:
#   - Runs PHPCS with WordPress coding standards
#   - Checks 17 WP.org compliance categories (trialware, security, source code,
#     libraries, i18n, external services, etc.) across the whole plugin
#   - AI review of every commit (changed files + readme.txt + main plugin file)
#   - Weekly AI audit of the whole plugin (and on demand: Actions > Run workflow)
#   - Posts detailed PR comment with findings + fix suggestions
#   - Blocks merge if any BLOCKER found
#
# Setup:
#   1. Copy this file to .github/workflows/wporg-compliance.yml
#   2. Update plugin-text-domain below to match your plugin slug
#   3. Add a GEMINI_API_KEY (or ANTHROPIC_API_KEY) secret to enable the AI review
#   4. Enable "Require status checks" in repo branch protection rules
#      and add "compliance / Compliance Gate" as required check
#
# No tokens or deploy keys are needed: the checker is embedded in the
# reusable workflow. This repo must allow access from WPPOOL repositories
# (Settings > Actions > General > Access), which is already set.

name: WP.org Compliance

on:
  workflow_dispatch:
    inputs:
      full-audit:
        description: 'AI-review the whole plugin, not only the latest change'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 1'   # full AI audit every Monday 03:00 UTC (runs on the default branch)
  push:
    branches: ['**']   # every commit pushed to any branch
    paths:
      - '.github/workflows/wporg-compliance.yml'
      - '**.php'
      - '**.js'
      - '**.jsx'
      - '**.ts'
      - '**.tsx'
      - '**.vue'
      - 'readme.txt'
      - 'readme.md'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - '.distignore'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.php'
      - '**.js'
      - '**.jsx'
      - '**.ts'
      - '**.tsx'
      - '**.vue'
      - 'readme.txt'
      - 'readme.md'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - '.distignore'

# The reusable workflow posts a PR comment and annotations.
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  compliance:
    uses: WPPOOL/wppool-plugin-reviewer/.github/workflows/wporg-compliance.yml@master
    with:
      plugin-dir: '.'                    # Change if plugin is in subdirectory
      php-version: '8.0'                 # Match your plugin's minimum PHP
      plugin-text-domain: 'your-plugin'  # ← CHANGE THIS to your plugin slug
      fail-on-warnings: false            # Set true to also block on warnings
      full-audit: ${{ inputs.full-audit == true }}  # scheduled runs always audit everything
      ai-provider: 'auto'                # auto | gemini | openai | claude (auto = first key found: Claude, OpenAI, Gemini)
      # gemini-model: 'gemini-flash-lite-latest'   # optional model overrides
      # openai-model: 'gpt-5-mini'
      # claude-model: 'claude-opus-5-5'
    # AI review of every commit: add GEMINI_API_KEY (or ANTHROPIC_API_KEY) as a repo or org secret.
    # Only the AI keys are passed on; the repo's other secrets (e.g. SVN) are not.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
